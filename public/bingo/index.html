<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo en casa</title>
<meta name="apple-mobile-web-app-title" content="Bingo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c99a5e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Sora;font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:800;font-display:swap;src:url(fonts/sora-latin-800-normal.woff2) format("woff2")}
:root{
  --wood1:#c99a5e;--wood2:#b98748;--wood3:#d6aa6f;
  --ink:#2a1d12;--cream:#fbf8f1;--red:#d9363e;--red2:#f08a7e;
  --green:#3c9a3a;--shadow:0 6px 18px rgba(60,35,10,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#c99a5e}
body{min-height:100vh}
body{
  font-family:"Nunito Sans",system-ui,sans-serif;color:var(--ink);
  background:
    repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(88deg,rgba(90,50,10,.07) 0 1px,transparent 1px 23px),
    linear-gradient(180deg,var(--wood3),var(--wood1) 40%,var(--wood2));
  background-attachment:fixed;
  padding-bottom:96px;
}
header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;max-width:980px;margin:0 auto;position:sticky;top:0;z-index:10;background:rgba(201,154,94,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:0 0 16px 16px}
header h1{font-family:Oswald,sans-serif;font-weight:700;font-size:26px;letter-spacing:1px;color:#fff;background:var(--red);padding:2px 12px;border-radius:8px;box-shadow:0 2px 0 rgba(80,40,0,.35)}
header .sp{flex:1}
.pill{font-size:12px;font-weight:800;background:rgba(255,255,255,.85);border-radius:999px;padding:5px 10px;white-space:nowrap}
.pill.host{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:6px 12px 20px;display:grid;gap:14px}
.panel{background:rgba(251,248,241,.94);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.panel h2{font-family:Oswald,sans-serif;font-size:17px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2 small{font-family:"Nunito Sans";text-transform:none;font-weight:600;font-size:13px;opacity:.6;letter-spacing:0}
.muted{opacity:.65;font-size:14px}
.note{font-size:13px;background:#fff3d6;border-radius:10px;padding:8px 10px;margin-top:8px}

/* tokens */
.token{
  --s:44px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fffaf0,#f1e2c6 70%,#e2cba2);
  box-shadow:0 2px 0 #c9a774,0 3px 6px rgba(60,30,0,.3);position:relative;flex:none
}
.token::before{content:"";position:absolute;inset:12%;border-radius:50%;border:2px solid var(--red)}
.token span{font-family:Oswald,sans-serif;font-weight:600;color:var(--red);font-size:calc(var(--s)*.42);position:relative;line-height:1}
.ball-row{display:flex;align-items:center;gap:16px}
.ball-big{--s:110px}
.ball-big::before{border-width:4px}
.ball-meta{flex:1;min-width:0}
.ball-meta .count{font-family:Oswald;font-size:15px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.ball-meta .words{font-family:Oswald;font-size:28px;font-weight:600;line-height:1.1;margin:2px 0 8px}
.prev{display:flex;gap:6px;flex-wrap:wrap}
.prev .token{--s:34px}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}

/* board */
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:560px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:Oswald;font-weight:500;font-size:clamp(11px,2.6vw,17px);
  color:rgba(42,29,18,.35);background:rgba(42,29,18,.05);border:none;transition:transform .15s}
.cell.called{background:radial-gradient(circle at 35% 30%,#fffaf0,#efdcbc 75%);color:var(--red);font-weight:600;box-shadow:inset 0 0 0 2px var(--red),0 1px 2px rgba(0,0,0,.2)}
.cell.last{background:var(--red);color:#fff;box-shadow:0 0 0 3px #ffd36b}
.board.clickable .cell:not(.called){cursor:pointer}
.board.clickable .cell:not(.called):hover{background:rgba(217,54,62,.15)}

/* cards */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{--c:var(--green);background:var(--cream);border-radius:6px;padding:9px 9px 6px;box-shadow:var(--shadow);
  border:2px solid var(--c);outline:1px solid var(--c);outline-offset:-6px;position:relative}
.grid{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(3,auto);border:1.5px solid var(--c);margin:4px}
.sq{aspect-ratio:.82;border:1px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.sq.blank{background:var(--c)}
.sq.num{cursor:pointer;color:var(--c)}
.sq .n{font-family:Oswald;font-weight:600;font-size:clamp(17px,4.8vw,30px);line-height:1}
.sq .m{font-family:Oswald;font-size:clamp(7px,1.6vw,10px);opacity:.9;margin-top:1px}
.sq .kern{position:absolute;width:48%;top:26%;left:30%;filter:drop-shadow(0 2px 1px rgba(80,50,0,.45));pointer-events:none}
.sq .kern.new{animation:drop .25s ease-out}
@keyframes drop{0%{transform:translateY(-12px) scale(1.3);opacity:0}100%{transform:none;opacity:1}}
.sq.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card-foot{display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-family:Oswald;font-size:12px;color:var(--c);letter-spacing:1px}
.badge{font-family:"Nunito Sans";font-weight:800;font-size:11px;letter-spacing:0;padding:2px 8px;border-radius:999px;background:var(--c);color:#fff}
.badge.hot{background:#ffcf3f;color:#3b2a00;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* controls */
button{font:inherit;cursor:pointer}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(42,29,18,.25)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big-draw{font-family:Oswald;font-size:22px;letter-spacing:.5px;padding:14px 22px;flex:1;min-width:170px}
select,input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid rgba(42,29,18,.2);background:#fff;font-size:16px}
.vbtn{display:flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:5px 5px 5px 12px;font-weight:700;font-size:14px;background:rgba(255,255,255,.85);color:var(--ink);min-height:40px}
.vbtn .vact{margin-left:4px;border-radius:8px;padding:6px 10px;background:var(--red);color:#fff;font-weight:800}
.vbtn.on .vact{background:var(--ink)}
.vbtn .vdot{width:9px;height:9px;border-radius:50%;background:#2fa84f;box-shadow:0 0 0 3px rgba(47,168,79,.25)}
.vseg{display:flex;background:rgba(255,255,255,.85);border-radius:10px;padding:3px;gap:2px}
.vseg button{border:none;background:transparent;border-radius:8px;padding:5px 9px;font-weight:700;font-size:14px}
.vseg button.on{background:var(--ink);color:#fff}
.vstatus{color:#fff;font-weight:700;font-size:13px;margin:-4px 6px 8px;text-shadow:0 1px 2px rgba(0,0,0,.5);min-height:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--red)}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;
  background:linear-gradient(transparent,rgba(60,30,5,.35) 30%);z-index:5}
.bar .btn{font-family:Oswald;font-size:22px;letter-spacing:.5px;padding:12px 0;flex:1;max-width:240px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.bar .linea{background:#ffcf3f;color:#3b2a00}
.bar .bingo{background:var(--red);color:#fff}

/* players */
.plist{display:grid;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;font-size:14px}
.pl .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.pl .nm{font-weight:800}
.pl .sp{flex:1}
.pl.claim{background:#fff3c4;box-shadow:inset 0 0 0 2px #f2b800}
.ok{color:#1f7a2a;font-weight:800}.bad{color:var(--red);font-weight:800}
.pl .btn{padding:6px 10px;font-size:13px}

.winners{background:linear-gradient(135deg,#ffe48a,#ffc94a);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.winners h2{font-family:Oswald;font-size:18px;text-transform:uppercase;margin-bottom:4px}
.winners li{list-style:none;font-weight:700;font-size:15px}

/* join */
.join{max-width:460px;margin:30px auto;text-align:center}
.join h2{justify-content:center;font-size:22px}
.join label{display:block;text-align:left;font-weight:800;font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px;opacity:.75}
.join input{width:100%}
.ncards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ncards button{padding:12px 0;border-radius:12px;border:2px solid rgba(42,29,18,.15);background:#fff;font-family:Oswald;font-size:20px}
.ncards button.on{border-color:var(--red);background:#ffe9e6;color:var(--red)}

/* overlay & toast */
.overlay{position:fixed;inset:0;background:rgba(30,15,0,.55);display:grid;place-items:center;z-index:20;padding:20px}
.overlay .box{background:var(--cream);border-radius:20px;padding:26px 22px;text-align:center;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.overlay .big{font-family:Oswald;font-size:54px;font-weight:700;color:var(--red);line-height:1}
.overlay p{margin:10px 0 16px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.overlay .wname{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(40px,13vw,72px);line-height:1.05;margin-top:6px;color:var(--ink);word-break:break-word;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.winbox{border:4px solid #ffcf3f}
.invite{display:grid;grid-template-columns:1fr auto;gap:8px;margin:-2px 0 12px}
.invite .btn{min-height:44px;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.inv-copy{background:#24272d;color:#fff}
.inv-wa{background:#25d366;color:#08331a}
.h-status{font-size:14px;margin:-2px 0 10px;color:#5a4a3a}
.h-status b{color:var(--ink)}
.h-main{width:100%;font-family:Oswald,sans-serif;font-size:24px;letter-spacing:.5px;padding:15px;border-radius:14px}
.h-auto{display:flex;align-items:center;gap:6px;margin-top:10px;background:#fff;border-radius:12px;padding:5px;box-shadow:inset 0 0 0 1.5px rgba(42,29,18,.12);position:relative;overflow:hidden}
.h-play{border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:15px;background:var(--ink);color:#fff;min-height:42px}
.h-auto.on .h-play{background:#ffcf3f;color:#3b2a00}
.h-every{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-left:auto;padding-right:4px}
.h-every select{padding:7px 8px;font-size:15px;font-weight:700}
.h-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(42,29,18,.08)}
.h-bar i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left;animation:hbar linear infinite}
@keyframes hbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.h-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.h-tools .btn{padding:10px 8px;font-size:14px;min-height:44px}
.h-tools .btn.warn{background:#ffe9e6;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.h-hint{font-size:13px;color:#7a6a58;margin-top:10px}
.bar .one{max-width:420px}
.token .ltr{position:absolute;top:14%;font-style:normal;font-family:Oswald,sans-serif;font-weight:700;color:var(--ink);font-size:calc(var(--s)*.16);z-index:1}
.ball-big span{margin-top:8%}
.board.b75{grid-template-columns:14px repeat(15,minmax(0,1fr));gap:2px;max-width:640px;width:100%}
.board .cell{padding:0;min-width:0;width:100%}
.board.b75 .cell{font-size:clamp(9px,2.3vw,14px)}
.bl-l{font-family:Oswald;font-weight:700;display:grid;place-items:center;justify-items:start;color:var(--red);font-size:13px}
.pick-h{font-family:Oswald;font-weight:600;text-transform:uppercase;letter-spacing:.4px;font-size:14px;margin:4px 0 8px}
.pick-h small{font-family:"Nunito Sans";text-transform:none;letter-spacing:0;font-weight:600;opacity:.6}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode{border:2px solid rgba(42,29,18,.12);background:#fff;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.mode.on{border-color:var(--red);background:#fff4f2;box-shadow:0 0 0 3px rgba(217,54,62,.15)}
.mode .mn{font-family:Oswald;font-weight:600;font-size:17px;margin-top:4px}
.mode .ms{font-size:12px;opacity:.65;text-align:center}
.mini{display:grid;gap:1.5px;padding:3px;border-radius:4px;background:#2f8fd8}
.mini i{background:#fff;border-radius:1px}
.mini.m90{grid-template-columns:repeat(9,1fr);width:100%;max-width:150px;background:#3c9a3a}
.mini.m90 i{aspect-ratio:.8}
.mini.m90 i.bl{background:#3c9a3a}
.mini.m75{grid-template-columns:repeat(5,1fr);width:78px}
.mini.m75 b{color:#fff;font-family:Oswald;font-size:10px;text-align:center;line-height:1.2}
.mini.m75 i{aspect-ratio:1}
.mini.m75 i.fr{background:#fff4d0}
.mini i.on{background:#ffcf3f}
.mini.m75 i.fr.on{background:#ffcf3f}
.mini.dense{gap:1px;padding:2px}
.mini.m75.dense{width:44px}
.mini.m90.dense{width:66px;max-width:none}
/* 5x5 slide-window card: light, neutral */
.card.c75{outline:none !important;font-family:Sora,"Nunito Sans",system-ui,sans-serif;background:#fbfbfa;border:none;
  border-radius:24px;padding:14px 12px 12px;max-width:380px;justify-self:center;width:100%;color:#1d1f23;
  box-shadow:0 1px 2px rgba(0,0,0,.16),0 8px 20px rgba(40,30,20,.16)}
.c75 .hdr5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 8px;background:none;border-radius:0}
.c75 .hdr5 b{font-family:Sora;font-weight:800;font-size:clamp(16px,4.6vw,21px);text-align:center;border-radius:10px;padding:4px 0;color:#fff;background:#24272d}
.c75 .grid.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border:none;margin:0;padding:0;background:none}
.c75 .sq.w5{aspect-ratio:1;border:none;border-radius:12px;background:#eeefef;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.c75 .sq.w5 .n{font-family:Sora;font-weight:700;font-size:clamp(19px,5.6vw,27px);letter-spacing:-.5px;position:relative;z-index:0;color:#1d1f23}
.c75 .sq.w5:active{background:#e4e5e6}
.c75 .sq.free{background:#d9dadb}
.c75 .sq.free .n{font-size:clamp(20px,5.6vw,27px);color:#fff;z-index:2}
.c75 .sq.free .m{font-family:Sora;font-weight:700;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#fff;position:relative;z-index:2;margin-top:2px}
.c75 .sq.w5.tgt{background:#fde3e1;box-shadow:inset 0 0 0 3.5px #d9363e}
/* covered numbers stay readable: the window is tinted glass, the number shows through in white */
.c75 .sq.w5.mk .n{z-index:2;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.35);transition:color .2s .15s}
.c75 .sq.w5 .sh{-webkit-backdrop-filter:none;backdrop-filter:none}
/* pattern cells keep the dark window; a red ring drawn above it shows the shape */
.c75 .sq.w5.tgt::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 3.5px #d9363e;z-index:3;pointer-events:none}
.c75.shape-on .sq.w5.mk:not(.tgt) .n{color:rgba(255,255,255,.9)}
.c75.shape-on .sq.w5:not(.tgt){background:#f4f4f3}
.c75.shape-on .sq.w5:not(.tgt) .n{color:#a3a5a9}
.c75.shape-on .sq.w5:not(.tgt) .sh{opacity:.55}
.c75 .shape-tag{font-weight:700;color:#d9363e}
.c75 .sh{position:absolute;inset:0;z-index:1;border-radius:12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(52,56,64,.80),rgba(30,32,38,.74));
  -webkit-backdrop-filter:blur(1.2px);backdrop-filter:blur(1.2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 5px rgba(0,0,0,.25);transform:translateY(-86%)}
.c75 .sh::after{content:"";position:absolute;left:36%;right:36%;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.75)}
.c75 .sh.closed{transform:translateY(0)}
.c75 .sh.in{animation:shIn .34s cubic-bezier(.3,1.45,.5,1)}
.c75 .sh.out{animation:shOut .24s ease-out}
@keyframes shIn{from{transform:translateY(-86%)}to{transform:translateY(0)}}
@keyframes shOut{from{transform:translateY(0)}to{transform:translateY(-86%)}}
.c75 .foot5{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 4px;font-family:Sora;font-weight:600;font-size:12px;color:#6c6f75}
.c75 .foot5 .badge{font-family:Sora;font-weight:700;background:#eeefef;color:#2c2f35;letter-spacing:0}
.c75 .foot5 .badge.hot{background:#ffcf3f;color:#2a1d00}
.c75 .sq.shake{animation:shake .35s}
.pick-h{font-family:Oswald;font-weight:600;text-transform:uppercase;letter-spacing:.4px;font-size:14px;margin:4px 0 8px}
.pick-h small{font-family:"Nunito Sans";text-transform:none;letter-spacing:0;font-weight:600;opacity:.6}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode{border:2px solid rgba(42,29,18,.12);background:#fff;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.mode.on{border-color:var(--red);background:#fff4f2;box-shadow:0 0 0 3px rgba(217,54,62,.15)}
.mode .mn{font-family:Oswald;font-weight:600;font-size:17px;margin-top:4px}
.mode .ms{font-size:12px;opacity:.65;text-align:center}
.mini{display:grid;gap:1.5px;padding:3px;border-radius:4px;background:#2f8fd8}
.mini i{background:#fff;border-radius:1px}
.mini.m90{grid-template-columns:repeat(9,1fr);width:100%;max-width:150px;background:#3c9a3a}
.mini.m90 i{aspect-ratio:.8}
.mini.m90 i.bl{background:#3c9a3a}
.mini.m75{grid-template-columns:repeat(5,1fr);width:78px}
.mini.m75 b{color:#fff;font-family:Oswald;font-size:10px;text-align:center;line-height:1.2}
.mini.m75 i{aspect-ratio:1}
.mini.m75 i.fr{background:#fff4d0}
.mini i.on{background:#ffcf3f}
.mini.m75 i.fr.on{background:#ffcf3f}
.mini.dense{gap:1px;padding:2px}
.mini.m75.dense{width:44px}
.mini.m90.dense{width:66px;max-width:none}

<script>
(() => {
"use strict";
const LS_KEY = "bingo-casa-v1";
const SERIES = [
  { c: "#3c9a3a", n: "SERIE 1" },
  { c: "#e2402f", n: "SERIE 5" },
  { c: "#2f8fd8", n: "SERIE 4" },
  { c: "#1d1d1d", n: "SERIE 7" },
];
const kernel = (isNew) => '<svg class="kern' + (isNew ? ' new' : '') + '" viewBox="0 0 40 46"><path d="M20 2C9 2 3 13 3 24c0 12 8 20 17 20s17-8 17-20C37 13 31 2 20 2z" fill="url(#kg)"/><ellipse cx="14" cy="16" rx="5" ry="7" fill="#fff8d0" opacity=".55"/><path d="M20 30c-3 0-5 4-5 8 0 2 2 4 5 4s5-2 5-4c0-4-2-8-5-8z" fill="#fffbe6" opacity=".8"/></svg>';

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (n) => Math.floor(Math.random() * n);

/* ---------- local player data ---------- */
function load() { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; } }
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(me)); } catch (e) {} }
let me = Object.assign({ name: "", ncards: 2, cards: [], round: null, marks: {}, auto: false, speak: false, voice: null, claim: null }, load() || {});
if (!me.voice) me.voice = me.speak ? "c" : "off";
if (me.voice !== "off") me.voice = "c";

/* ---------- shared game state ---------- */
const MODES = {
  l90: { name: "Lotería", sub: "90 bolas · cartón de 3×9", max: 90, prizes: ["linea", "dos", "lleno"] },
  b75: { name: "Bingo americano", sub: "75 bolas · cartón de 5×5", max: 75, prizes: ["linea", "esquinas", "x", "cruz", "t", "l", "marco", "lleno"] },
};
const PRIZES = {
  l90: { linea: { n: "Línea", d: "Una fila completa" }, dos: { n: "Dos líneas", d: "Dos filas del mismo cartón" }, lleno: { n: "Bingo", d: "Cartón lleno" } },
  b75: { linea: { n: "Línea", d: "Fila, columna o diagonal" }, esquinas: { n: "Cuatro esquinas", d: "Las 4 puntas" }, x: { n: "Equis", d: "Las dos diagonales" },
    cruz: { n: "Cruz", d: "Fila y columna del centro" }, t: { n: "T", d: "Fila de arriba y columna N" }, l: { n: "L", d: "Columna B y fila de abajo" },
    marco: { n: "Marco", d: "Todo el borde" }, lleno: { n: "Bingo", d: "Cartón lleno" } },
};
const DEFAULT_PRIZES = { l90: ["linea", "lleno"], b75: ["linea", "esquinas", "l", "lleno"] };
const EMPTY = { round: 0, drawn: [], winners: [], phase: "espera", mode: "l90", prizes: ["linea", "lleno"], pidx: 0 };
const R5 = (r) => [0, 1, 2, 3, 4].map((c) => r * 5 + c), C5 = (c) => [0, 1, 2, 3, 4].map((r) => r * 5 + c);
const D1 = [0, 6, 12, 18, 24], D2 = [4, 8, 12, 16, 20];
const uniq = (...a) => [...new Set(a.flat())];
const LINES75 = [0, 1, 2, 3, 4].map(R5).concat([0, 1, 2, 3, 4].map(C5), [D1, D2]);
const SHAPES75 = { esquinas: [0, 4, 20, 24], x: uniq(D1, D2), cruz: uniq(R5(2), C5(2)), t: uniq(R5(0), C5(2)),
  l: uniq(C5(0), R5(4)), marco: uniq(R5(0), R5(4), C5(0), C5(4)), lleno: [...Array(25).keys()] };
const cur = () => state.prizes[state.pidx] || "lleno";
const pname = (t, mode = state.mode) => (PRIZES[mode][t] || { n: t }).n;
const plow = (t) => { const n = pname(t); return n.length <= 2 ? "la " + n : n.toLowerCase(); };
const letterOf = (n) => "BINGO"[Math.floor((n - 1) / 15)];
const playing = () => state.phase === "jugando";
let state = { ...EMPTY };
const SB_URL = "https://yfjaznujnvkqgdlbnviu.supabase.co";
const SB_KEY = "sb_publishable_HyGsQ2i78GnWfRDUsW3ByQ_SQ6dCy_S";
const GAME = "casa";
let sb = null, live = false, hostKey = null;
let offline = false;
let isHost = false, localMode = false, loaded = false, stale = false;
let players = new Map();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
let inflight = 0, chain = Promise.resolve();
let autoOn = false, autoSec = 8, autoTimer = null;
let lastAnimated = null;

/* ---------- card generation: lotería 3x9 (15 números) y bingo 5x5 (24 + libre) ---------- */
function colRange(c) { return c === 0 ? [1, 9] : c === 8 ? [80, 90] : [c * 10, c * 10 + 9]; }
function makeCard() {
  for (let attempt = 0; attempt < 200; attempt++) {
    const counts = Array(9).fill(1);
    let extra = 6;
    while (extra > 0) { const c = rnd(9); if (counts[c] < 3) { counts[c]++; extra--; } }
    const grid = [Array(9).fill(0), Array(9).fill(0), Array(9).fill(0)];
    const rc = [0, 0, 0];
    const order = [...Array(9).keys()].sort((a, b) => counts[b] - counts[a] || Math.random() - 0.5);
    for (const c of order) {
      const rows = [0, 1, 2].sort((a, b) => rc[a] - rc[b] || Math.random() - 0.5).slice(0, counts[c]);
      for (const r of rows) { grid[r][c] = 1; rc[r]++; }
    }
    if (rc.some((x) => x !== 5)) continue;
    for (let c = 0; c < 9; c++) {
      const [lo, hi] = colRange(c);
      const pool = []; for (let n = lo; n <= hi; n++) pool.push(n);
      const pick = [];
      while (pick.length < counts[c]) pick.push(pool.splice(rnd(pool.length), 1)[0]);
      pick.sort((a, b) => a - b);
      let k = 0;
      for (let r = 0; r < 3; r++) if (grid[r][c]) grid[r][c] = pick[k++];
    }
    return grid.flat();
  }
  return null;
}
function makeCard75() {
  const card = Array(25).fill(0);
  for (let c = 0; c < 5; c++) {
    const pool = []; for (let n = c * 15 + 1; n <= c * 15 + 15; n++) pool.push(n);
    for (let r = 0; r < 5; r++) { if (r === 2 && c === 2) continue; card[r * 5 + c] = pool.splice(rnd(pool.length), 1)[0]; }
  }
  return card;
}
const makeCardFor = (mode) => (mode === "b75" ? makeCard75() : makeCard());
const cardMode = (card) => (Array.isArray(card) && card.length === 25 ? "b75" : "l90");
function validCard(card, mode) {
  if (!Array.isArray(card)) return false;
  const len = mode === "b75" ? 25 : 27, max = MODES[mode].max;
  return card.length === len && card.every((n) => Number.isInteger(n) && n >= 0 && n <= max) && (mode !== "b75" || card[12] === 0);
}
/* how many numbers are still missing on one card for a prize; has(n) says whether n counts */
function missing(card, prize, has, mode = state.mode) {
  if (!validCard(card, mode)) return 99;
  if (mode === "l90") {
    const rows = cardRows(card).map((r) => r.filter((n) => !has(n)).length).sort((a, b) => a - b);
    if (prize === "linea") return rows[0];
    if (prize === "dos") return rows[0] + rows[1];
    return rows[0] + rows[1] + rows[2];
  }
  const cnt = (set) => set.filter((i) => card[i] && !has(card[i])).length;
  if (prize === "linea") return Math.min(...LINES75.map(cnt));
  return cnt(SHAPES75[prize] || SHAPES75.lleno);
}
const cardRows = (card) => [card.slice(0, 9), card.slice(9, 18), card.slice(18, 27)].map((r) => r.filter(Boolean));
const cardNums = (card) => card.filter(Boolean);

/* ---------- marks & progress ---------- */
const drawnSet = () => new Set(state.drawn);
function markedSet(i) {
  const ds = drawnSet();
  if (me.auto) return new Set(cardNums(me.cards[i]).filter((n) => ds.has(n)));
  return new Set((me.marks[i] || []).filter((n) => ds.has(n)));
}
function progress(i, prize = cur()) {
  const ms = markedSet(i);
  return missing(me.cards[i], prize, (n) => ms.has(n));
}
function myBest() {
  let now = 99, full = 99;
  me.cards.forEach((_, i) => { now = Math.min(now, progress(i)); full = Math.min(full, progress(i, "lleno")); });
  return { line: now, full };
}

/* verify a claim using the drawn numbers (host side) */
function verify(cards, type) {
  if (!Array.isArray(cards)) return false;
  const ds = drawnSet();
  return cards.some((card) => missing(card, type, (n) => ds.has(n)) === 0);
}

/* ---------- state handling ---------- */
function clean(d) {
  if (!d || typeof d !== "object") return { ...EMPTY };
  const mode = MODES[d.mode] ? d.mode : "l90";
  const max = MODES[mode].max;
  const seen = new Set();
  const drawn = (Array.isArray(d.drawn) ? d.drawn : []).filter((n) => Number.isInteger(n) && n >= 1 && n <= max && !seen.has(n) && seen.add(n));
  let prizes = (Array.isArray(d.prizes) ? d.prizes : []).filter((t) => PRIZES[mode][t]);
  prizes = MODES[mode].prizes.filter((t) => prizes.includes(t));
  if (!prizes.length) prizes = DEFAULT_PRIZES[mode].slice();
  const legacy = (t) => (t === "bingo" ? "lleno" : t);
  const winners = (Array.isArray(d.winners) ? d.winners : []).filter((w) => w && typeof w === "object")
    .map((w) => ({ type: PRIZES[mode][legacy(w.type)] ? legacy(w.type) : "lleno", name: String(w.name || "Alguien").slice(0, 24), at: Number(w.at) || 0 }));
  let phase = d.phase, pidx = Number.isInteger(d.pidx) ? d.pidx : 0;
  if (phase === "linea") { phase = "jugando"; pidx = 0; }

  if (!["espera", "jugando", "terminado"].includes(phase)) phase = "espera";
  pidx = Math.max(0, Math.min(pidx, prizes.length - 1));
  return { round: Number(d.round) || 0, drawn, winners, phase, mode, prizes, pidx };
}
function applyState(next) {
  const prev = state;
  state = next;
  if (me.round !== state.round) {
    const newGame = me.round != null && state.phase === "jugando";
    me.round = state.round; me.marks = {}; me.claim = null;
    if (newGame && me.cards.length) me.cards = Array.from({ length: me.ncards || 1 }, () => makeCardFor(state.mode));
    persist();
  }
  if (me.cards.length && cardMode(me.cards[0]) !== state.mode && (state.phase === "jugando" || prev.mode !== state.mode)) {
    me.cards = Array.from({ length: me.ncards || me.cards.length }, () => makeCardFor(state.mode));
    me.marks = {}; me.claim = null; persist();
    if (prev.mode !== state.mode) toast("Nuevo juego: " + MODES[state.mode].name + ". Tus cartones cambiaron.");
  }
  if (me.claim && state.winners.some((w) => w.type === me.claim.type && w.name === me.name)) {
    // confirmed
  }
  if (state.round === prev.round && state.drawn.length > prev.drawn.length) {
    const n = state.drawn[state.drawn.length - 1];
    say(n);
    lastAnimated = n;
  } else if (state.round !== prev.round) {
    lastAnimated = null;
    if (prev.round && state.round) toast("¡Nueva partida! Marcas reiniciadas");
  }
  // celebrate new winners
  if (state.winners.length > prev.winners.length && state.round === prev.round) {
    const w = state.winners[state.winners.length - 1];
    celebrate(w);
    stopAuto();
  }
  pushPresence();
  renderGame();
  if (typeof chatRound === "function" && chatRoundShown !== null && chatRoundShown !== chatRound()) loadChat();

function save(next) {
  next = clean(next);
  applyState(next);
  if (localMode || !sb || !hostKey) return;
  inflight++;
  const args = { p_game: GAME, p_key: hostKey, p_round: next.round, p_drawn: next.drawn, p_winners: next.winners, p_phase: next.phase,
    p_mode: next.mode, p_prizes: next.prizes, p_pidx: next.pidx };
  chain = chain.then(async () => { const { error } = await sb.rpc("bingo_set_state", args); if (error) throw error; })
    .catch((e) => toast("No se pudo guardar: " + (e && e.message ? e.message : "error")))
    .finally(() => { inflight--; });
}

/* ---------- host actions ---------- */
function newGame(mode = state.mode, prizes = state.prizes) {
  stopAuto();
  save({ round: (state.round || 0) + 1, drawn: [], winners: [], phase: "jugando", mode, prizes, pidx: 0 });
}
function draw(n) {
  if (!playing()) return;
  const max = MODES[state.mode].max;
  if (n == null) {
    const ds = drawnSet();
    const rest = []; for (let i = 1; i <= max; i++) if (!ds.has(i)) rest.push(i);
    if (!rest.length) { stopAuto(); return toast("Ya salieron los " + max + " números"); }

function undo() {
  if (!state.drawn.length) return;
  save({ ...state, drawn: state.drawn.slice(0, -1) });
  toast("Se quitó la última bola");
}
function confirmWin(name, type) {
  const winners = [...state.winners, { type, name, at: state.drawn.length }];
  let { phase, pidx } = state;
  if (type === cur()) { pidx += 1; if (pidx >= state.prizes.length) { phase = "terminado"; pidx = state.prizes.length - 1; } }
  stopAuto();
  save({ ...state, winners, phase, pidx });
}
function startAuto() {
  stopAuto();
  autoOn = true;
  autoTimer = setInterval(() => {
    if (pendingClaims().length) { stopAuto(); toast("Pausa: alguien cantó. Revisa el reclamo."); renderHost(); return; }
    draw();
  }, autoSec * 1000);
  draw();
  renderHost();
}
function stopAuto() { autoOn = false; clearInterval(autoTimer); autoTimer = null; }

/* ---------- players (Supabase) ---------- */
if (!me.pid) { me.pid = uid(); me.pkey = uid() + uid(); persist(); }
let pushT = null, pushing = Promise.resolve(), pendingPush = false, lastPushedClaim = null;
function pushPresence() {
  if (!sb || localMode || !me.name || !me.cards.length) return;
  clearTimeout(pushT);
  pendingPush = true;
  pushT = setTimeout(() => {
    const best = myBest();
    const claimNow = me.claim && me.claim.round === state.round ? me.claim : null;
    const args = { p_game: GAME, p_player: me.pid, p_key: me.pkey, p_name: me.name.slice(0, 24), p_cards: me.cards,
      p_round: state.round, p_line: best.line, p_full: best.full, p_claim: claimNow };
    pushing = pushing.then(async () => {
      const { error } = await sb.rpc("bingo_player_upsert", args);
      if (error) throw error;
      lastPushedClaim = claimNow;
    }).catch((e) => { console.warn(e); }).finally(() => { pendingPush = false; });
  }, 300);
}
const ACTIVE_MS = 75 * 1000;
function playersHere() {
  const now = Date.now();
  return [...players.values()].filter((r) => r && r.name && now - Date.parse(r.seen_at) < ACTIVE_MS)
    .map((r) => ({ peer: r.id, isMe: r.id === me.pid, name: String(r.name).slice(0, 24), round: r.round, cards: r.cards,
      line: Number(r.line_left), full: Number(r.full_left), claim: r.claim }));
}
function onPlayerRow(r) {
  if (!r || r.game_id !== GAME) return;
  players.set(r.id, r);
  if (r.id === me.pid && me.claim && !r.claim && lastPushedClaim && !pendingPush) {
    me.claim = null; lastPushedClaim = null; persist();
    showOverlay("Aún no", "El anfitrión revisó tu cartón y todavía no cuadra. ¡Sigue jugando!", false);

let confT = null;
function confetti(count) {

  const ps = Array.from({ length: count }, (_, i) => {

      w: 6 + Math.random() * 7, h: 9 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      c: cols[i % cols.length], kernel: i % 9 === 0 };
  });
  const t0 = performance.now();
  cancelAnimationFrame(confT);
  const step = (t) => {
    const el = t - t0;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps) {
      p.vy += 0.32; p.vx *= 0.985; p.vy = Math.min(p.vy, 7 + Math.sin(p.r) * 1.5);
      p.x += p.vx + Math.sin((el / 300) + p.r) * 0.8; p.y += p.vy; p.r += p.vr;
      if (p.y < H + 30) alive++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);

}

    if (ok) { toast("Link copiado; pégalo en WhatsApp"); return; }
  } catch (e) {}
  toast("No se pudo copiar; usa el botón WhatsApp");
}
function wireInvite() { const b = $("#h-copy"); if (b) b.onclick = copyInvite; }
function renderHost() {
  const el = $("#sec-host");
  if (!isHost) { el.hidden = true; return; }
  el.hidden = false;
  const left = MODES[state.mode].max - state.drawn.length;
  const head = `<h2>Anfitrión <small>solo tú ves este panel</small></h2>`;
  const invite = `<div class="invite">
      <button class="btn inv-copy" id="h-copy">🔗 Copiar link para invitar</button>
      <a class="btn inv-wa" id="h-wa" href="${waLink()}" target="_blank" rel="noopener">WhatsApp</a>
    </div>`;
  if (!playing()) {
    if (!sel) sel = { mode: state.mode, prizes: new Set(state.prizes) };
    const ended = state.phase === "terminado";
    const winTxt = state.winners.filter((w) => w.type === "lleno").map((w) => esc(w.name)).join(", ");
    const order = MODES[sel.mode].prizes.filter((t) => sel.prizes.has(t));
    el.innerHTML = head + `
      ${ended ? `<div class="h-status"><b>Partida terminada</b>${winTxt ? ` · bingo de ${winTxt}` : ""}</div>` : ""}
      <div class="pick-h">1 · Tipo de bingo</div>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => `
        <button class="mode ${sel.mode === k ? "on" : ""}" data-mode="${k}">
          ${miniCard(k)}
          <span class="mn">${m.name}</span><span class="ms">${m.sub}</span>
        </button>`).join("")}</div>
      <div class="pick-h">2 · Premios <small>se juegan en este orden</small></div>
      <div class="prizes">${MODES[sel.mode].prizes.map((t) => {
        const on = sel.prizes.has(t), pos = order.indexOf(t) + 1;
        return `<button class="prize ${on ? "on" : ""}" data-prize="${t}" aria-pressed="${on}">
          ${prizeIcon(sel.mode, t)}<span class="pn">${esc(pname(t, sel.mode))}</span><span class="pd">${esc(PRIZES[sel.mode][t].d || "")}</span>
          <span class="pos">${on ? pos : ""}</span></button>`;
      }).join("")}</div>
      <div class="h-order">${order.map((t) => esc(pname(t, sel.mode))).join(" → ")}</div>
      <button class="btn primary h-main" id="h-new">${ended ? "Jugar otra partida" : "Empezar partida"}</button>
      <p class="h-hint">Al empezar, cada jugador recibe cartones del tipo elegido; las marcas se borran.</p>`;
    el.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => {
      if (sel.mode === b.dataset.mode) return;
      sel = { mode: b.dataset.mode, prizes: new Set(DEFAULT_PRIZES[b.dataset.mode]) }; renderHost();
    });
    el.querySelectorAll("[data-prize]").forEach((b) => b.onclick = () => {
      const t = b.dataset.prize;
      if (sel.prizes.has(t)) { if (sel.prizes.size === 1) return toast("Elige al menos un premio"); sel.prizes.delete(t); } else sel.prizes.add(t);
      renderHost();
    });
    $("#h-new").onclick = () => { const m = sel.mode, pr = MODES[m].prizes.filter((t) => sel.prizes.has(t)); sel = null; newGame(m, pr); };
    return;
  }
  sel = null;
  el.innerHTML = head + invite + `
    <div class="h-status"><b>${MODES[state.mode].name}</b> · ${left} bolas en la bolsa</div>
    <div class="h-steps">${state.prizes.map((t, i) => `<span class="${i < state.pidx ? "done" : i === state.pidx ? "now" : ""}">${i < state.pidx ? "✓ " : ""}${esc(pname(t))}</span>`).join("")}</div>
    <button class="btn primary h-main" id="h-draw" ${autoOn || !left ? "disabled" : ""}>${autoOn ? "Sacando solo…" : "Sacar bola"}</button>
    <div class="h-auto ${autoOn ? "on" : ""}">
      <button class="h-play" id="h-auto">${autoOn ? "⏸ Pausar" : "▶ Automático"}</button>
      <label class="h-every">cada
        <select id="h-sec" aria-label="Segundos entre bolas">${[5, 8, 12, 20].map((x) => `<option value="${x}" ${x === autoSec ? "selected" : ""}>${x} s</option>`).join("")}</select>
      </label>
      ${autoOn ? `<span class="h-bar"><i style="animation-duration:${autoSec}s"></i></span>` : ""}
    </div>
    <div class="h-tools">
      <button class="btn ghost" id="h-undo" ${state.drawn.length ? "" : "disabled"}>↶ Deshacer última</button>
      <button class="btn ghost" id="h-new">Terminar partida</button>
    </div>
    <p class="h-hint">¿Usas la bolsa de fichas? Toca el número en el tablero.</p>`;
  wireInvite();
  $("#h-draw").onclick = () => draw();
  $("#h-auto").onclick = () => { autoOn ? (stopAuto(), renderHost()) : startAuto(); };
  $("#h-sec").onchange = (e) => { autoSec = +e.target.value; if (autoOn) startAuto(); else renderHost(); };
  $("#h-undo").onclick = undo;
  $("#h-new").onclick = () => {
    const b = $("#h-new");
    if (state.drawn.length && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = "¿Seguro? Toca otra vez"; b.classList.add("warn"); return; }
    stopAuto(); save({ ...state, phase: "terminado" });
  };
}
function renderBoard() {
  const el = $("#sec-board");
  const ds = drawnSet(), last = state.drawn[state.drawn.length - 1];
  const clickable = isHost && playing();
  const max = MODES[state.mode].max;
  $("#boardHint").textContent = state.drawn.length ? `${state.drawn.length} cantados · ${max - state.drawn.length} quedan` : "";
  const cell = (n) => `<button class="cell ${ds.has(n) ? "called" : ""} ${n === last ? "last" : ""}" data-n="${n}" ${clickable ? "" : "tabindex=-1"}>${n}</button>`;
  let h = "";
  if (state.mode === "b75") {
    for (let r = 0; r < 5; r++) { h += `<span class="bl-l">${"BINGO"[r]}</span>`; for (let n = r * 15 + 1; n <= r * 15 + 15; n++) h += cell(n); }
    el.innerHTML = `<div class="board b75 ${clickable ? "clickable" : ""}">${h}</div>`;
  } else {
    for (let n = 1; n <= 90; n++) h += cell(n);
    el.innerHTML = `<div class="board ${clickable ? "clickable" : ""}">${h}</div>`;
  }
  if (clickable) el.querySelectorAll(".cell:not(.called)").forEach((b) => b.onclick = () => draw(+b.dataset.n));
}
function renderCards() {
  const el = $("#sec-cards");
  if (!el) return;
  const t = cur();
  const shape = state.mode === "b75" && playing() && SHAPES75[t] && t !== "lleno" ? SHAPES75[t] : [];
  el.innerHTML = me.cards.map((card, i) => {
    const s = SERIES[i % SERIES.length];
    const ms = markedSet(i);
    let badge = "";
    if (playing() && state.drawn.length) {
      const m = progress(i);
      badge = m === 0 ? `<span class="badge hot">¡Tienes ${esc(plow(t))}!</span>`
        : `<span class="badge ${m === 1 ? "hot" : ""}">${m === 1 ? "Falta" : "Faltan"} ${m} para ${esc(plow(t))}</span>`;
    }
    const sq = (n, idx) => {
      if (cardMode(card) === "b75") {
        const col = "k" + (idx % 5);
        if (idx === 12) return `<div class="sq w5 free ${col} ${shape.includes(12) ? "tgt" : ""}"><span class="n">★</span><span class="m">Libre</span>${shutter(true, "")}</div>`;
        return `<div class="sq w5 num ${col} ${shape.includes(idx) ? "tgt" : ""} ${ms.has(n) ? "mk" : ""}" data-i="${i}" data-n="${n}"><span class="n">${n}</span>${shutter(ms.has(n), i + ":" + n)}</div>`;
      }
      if (!n) return `<div class="sq blank"></div>`;
      return `<div class="sq num ${shape.includes(idx) ? "tgt" : ""}" data-i="${i}" data-n="${n}"><span class="n">${n}</span><span class="m">${n}</span>${ms.has(n) ? kernel(justMarked === i + ":" + n) : ""}</div>`;
    };
    if (cardMode(card) === "b75") {
      return `<div class="card c75 ${shape.length ? "shape-on" : ""}"><div class="hdr5"><b class="k0">B</b><b class="k1">I</b><b class="k2">N</b><b class="k3">G</b><b class="k4">O</b></div>
        <div class="grid grid5">${card.map(sq).join("")}</div>
        <div class="foot5"><span>Cartón ${i + 1}</span>${badge}</div></div>`;
    }
    return `<div class="card" style="--c:${s.c}"><div class="grid">${card.map(sq).join("")}</div>
      <div class="card-foot"><span>${s.n}</span>${badge}<span>Nº ${i + 1}</span></div></div>`;
  }).join("");
  el.querySelectorAll(".sq.num").forEach((c) => c.onclick = () => toggleMark(+c.dataset.i, +c.dataset.n, c));
}
function renderPlayers() {
  const el = $("#sec-players");
  if (!el) return;
  if (localMode) { el.hidden = true; return; }
  const list = playersNow();
  el.hidden = false;
  const claims = new Set(pendingClaims().map((p) => p.peer));
  el.innerHTML = `<h2>Jugadores <small>${list.length} conectados</small></h2>
    <div class="plist">${list.length ? list.map((p) => {
      const c = claims.has(p.peer) ? p.claim : null;
      let right = "";
      if (c) {
        const ok = verify(p.cards, c.type);
        right = `<span class="${ok ? "ok" : "bad"}">¡${esc(pname(c.type))}! ${ok ? "✓ válido" : "✗ no cuadra"}</span>` +
          (isHost ? ` <button class="btn primary" data-ok="${esc(p.peer)}" data-t="${c.type}">Confirmar</button> <button class="btn ghost" data-no="${esc(p.peer)}">Rechazar</button>` : "");
      } else {
        const l = Number.isFinite(p.line) && p.line < 99 ? p.line : null;
        right = `<span class="muted">${playing() && l != null ? `faltan ${l} p/ ${esc(plow(cur()))}` : ""}</span>`;
      }
      return `<div class="pl ${c ? "claim" : ""}"><span class="dot"></span><span class="nm">${esc(p.name)}${p.isMe ? " (tú)" : ""}</span>
        <span class="muted">${Array.isArray(p.cards) ? p.cards.length : 0} cart.</span><span class="sp"></span>${right}</div>`;
    }).join("") : `<p class="muted">Aún no hay jugadores en la sala.</p>`}</div>`;
  el.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => {
    const p = playersHere().find((x) => x.peer === b.dataset.ok);
    if (p) confirmWin(p.name, b.dataset.t);
  });
  el.querySelectorAll("[data-no]").forEach((b) => b.onclick = () => {
    sb.rpc("bingo_reject", { p_game: GAME, p_key: hostKey, p_player: b.dataset.no })
      .then(({ error }) => toast(error ? "No se pudo avisar al jugador" : "Reclamo rechazado"));
  });
}
function renderBar() {
  const bar = $("#bar");
  if (!me.name || !me.cards.length || !playing()) { bar.innerHTML = ""; return; }
  const t = cur();
  const label = playing() ? (pname(t).length <= 2 ? "¡CANTAR " + pname(t) + "!" : "¡" + pname(t).toUpperCase() + "!") : state.phase === "terminado" ? "Partida terminada" : "Esperando…";
  bar.innerHTML = `<div class="bar"><button class="btn ${t === "lleno" ? "bingo" : "linea"} one" id="c-claim" ${playing() ? "" : "disabled"}>${label}</button></div>`;
  $("#c-claim").onclick = () => claim(t);
}

/* ---------- updates ---------- */
const BUILD = "20261122144045";
let updateShown = false;
async function checkUpdate() {
  try {
    const r = await fetch("version.txt?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (!v || v === BUILD) return;
    if (!playing()) { location.reload(); return; }
    if (updateShown) return; updateShown = true;
    const d = document.createElement("button");
    d.className = "upd"; d.textContent = "Hay una versión nueva · toca para actualizar";
    d.onclick = () => location.reload();
    document.body.appendChild(d);
  } catch (e) {}
}
setInterval(checkUpdate, 60000);
setTimeout(checkUpdate, 3000);

/* ---------- boot ---------- */
// host link: #anfitrion=<key>, kept on this device and removed from the address bar
(() => {
  const m = location.hash.match(/anfitrion=([A-Za-z0-9_-]{8,64})/);
  try {
    if (m) localStorage.setItem("bingo-host-key", m[1]);
    hostKey = localStorage.getItem("bingo-host-key");
  } catch (e) { hostKey = m ? m[1] : null; }
})();
render();

async function loadAll() {
  const [g, p] = await Promise.all([
    sb.from("bingo_games").select("*").eq("id", GAME).maybeSingle(),
    sb.from("bingo_players").select("id,game_id,name,cards,round,line_left,full_left,claim,seen_at").eq("game_id", GAME)
      .gt("seen_at", new Date(Date.now() - ACTIVE_MS).toISOString()),
  ]);
  if (g.error || p.error) throw g.error || p.error;
  stale = false; loaded = true;
  if (!(isHost && inflight > 0)) applyState(clean(g.data));
  players = new Map((p.data || []).map((r) => [r.id, r]));
  renderPlayers(); netPill();
}

(async () => {
  if (!window.supabase || !window.supabase.createClient) { stale = true; loaded = true; renderGame(); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  if (hostKey) {
    const { data } = await sb.rpc("bingo_host_check", { p_game: GAME, p_key: hostKey });
    isHost = data === true;
    // a home-screen icon saves the current address: make sure it is the host link on a host's phone
    if (isHost && !/anfitrion=/.test(location.hash)) { try { history.replaceState(null, "", location.pathname + location.search + "#anfitrion=" + hostKey); } catch (e) {} }
    if (!isHost) { try { localStorage.removeItem("bingo-host-key"); } catch (e) {} hostKey = null; }
  }
  try { await loadAll(); } catch (e) { stale = true; loaded = true; renderGame(); }
  sb.channel("bingo-" + GAME)
    .on("postgres_changes", { event: "*", schema: "public", table: "bingo_games", filter: "id=eq." + GAME }, (pl) => {
      if (isHost && inflight > 0) return;
      if (pl.new && pl.new.id) applyState(clean(pl.new));
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "bingo_messages", filter: "game_id=eq." + GAME }, () => loadChat())
    .on("postgres_changes", { event: "*", schema: "public", table: "bingo_players", filter: "game_id=eq." + GAME }, (pl) => {
      if (pl.eventType === "DELETE") { players.delete(pl.old && pl.old.id); renderPlayers(); return; }
      onPlayerRow(pl.new);
    })
    .subscribe((st) => { live = st === "SUBSCRIBED"; netPill(); });
  // safety net: refresh every few seconds when the live channel is down, and keep my seat alive
  // the game row is tiny: read it every second whether or not the live channel works; players every 5 s
  let fails = 0;
  setInterval(async () => {
    if (document.hidden) return;
    try {
      const { data, error } = await sb.from("bingo_games").select("*").eq("id", GAME).maybeSingle();
      if (error) throw error;
      fails = 0; if (stale) { stale = false; netPill(); }
      if (!(isHost && inflight > 0) && data) {
        const n = clean(data);
        if (n.round !== state.round || n.drawn.length !== state.drawn.length || n.phase !== state.phase || n.pidx !== state.pidx || n.mode !== state.mode
            || n.winners.length !== state.winners.length || n.drawn[n.drawn.length - 1] !== state.drawn[state.drawn.length - 1]) applyState(n);
      }
    } catch (e) { if (++fails >= 5 && !stale) { stale = true; netPill(); renderBall(); } }
  }, 1000);
  setInterval(() => { if (!document.hidden) loadAll().catch(() => {}); }, 5000);
  setInterval(() => pushPresence(), 30000);
  loadChat();
  setInterval(() => { if (!document.hidden) loadChat(); }, 2500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadAll().catch(() => {}); pushPresence(); } });
  pushPresence();
})();
})();
</script>
