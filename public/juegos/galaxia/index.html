<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080c">
<title>Galaxia · Juegos en casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080c;color:#f1e9dc;font-family:'Chakra Petch',system-ui,sans-serif;overscroll-behavior:none}
body{background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 0%,#1a1610,#07080c 60%) fixed}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.h{font-family:Orbitron,sans-serif;letter-spacing:2px;text-transform:uppercase}
.lbl{font-size:10px;letter-spacing:3px;color:#ff9f2e;text-transform:uppercase;font-weight:700}
.dim{color:#9a8f80}.ok{color:#59d8ff}.no{color:#ff4d5e}.rare{color:#a879ff}
.p{background:linear-gradient(160deg,rgba(32,28,22,.95),rgba(12,13,17,.95));clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:inset 0 0 0 1px rgba(255,159,46,.35)}
.btn,.btn2{display:block;width:100%;border:none;font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:2px;text-transform:uppercase;text-align:center;padding:14px 8px;font-size:12px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);cursor:pointer}
.btn{background:#ff9f2e;color:#1a0f00}
.btn2{background:rgba(89,216,255,.1);color:#59d8ff;box-shadow:inset 0 0 0 1px rgba(89,216,255,.6)}
.btn[disabled],.btn2[disabled]{background:#2a241c;color:#6e6458;box-shadow:none}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;background:#101217;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);box-shadow:inset 0 0 0 1px rgba(255,159,46,.25);min-width:0}
.slot span{font-size:9px;letter-spacing:1px;color:#9a8f80;text-align:center}
.slot b.h{font-size:13px}
.slot.bad{box-shadow:inset 0 0 0 1px rgba(255,77,94,.7)}
.slot.rareb{box-shadow:inset 0 0 0 1px rgba(168,121,255,.7),0 0 12px rgba(168,121,255,.25)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid rgba(255,159,46,.25);background:rgba(7,8,12,.92);backdrop-filter:blur(6px)}
.top a{color:#9a8f80;text-decoration:none;font-size:18px;padding:0 4px}
.top .st{font-size:11px;letter-spacing:2px;color:#9a8f80}.top .st b{color:#f1e9dc}
.mis{margin:10px 14px 0;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
#view{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 14px 16px}
nav.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid rgba(255,159,46,.25);background:rgba(7,8,12,.96);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;font-family:Orbitron,sans-serif;font-size:9px;font-weight:800;letter-spacing:1px;color:#9a8f80;text-transform:uppercase;cursor:pointer}
nav.tabs button.on{color:#ff9f2e;box-shadow:inset 0 2px 0 #ff9f2e;background:linear-gradient(rgba(255,159,46,.15),transparent)}
.seg{flex:1;display:grid;gap:2px}.seg i{height:9px;background:#1e1a14}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,159,46,.12)}
.kv span{color:#9a8f80}.kv b{text-align:right}
.bar{height:8px;background:#1e1a14}.bar>i{display:block;height:100%}
.field{position:relative;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:inset 0 0 0 1px rgba(255,159,46,.35);touch-action:manipulation}
.field svg{display:block;width:100%;height:auto}
.field [data-t]{cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
#sheet.on{display:flex;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet>.p{width:100%;max-width:544px;max-height:72dvh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px #59d8ff,0 -10px 40px rgba(0,0,0,.7)}
#veil{position:fixed;inset:0;z-index:19;display:none;background:rgba(0,0,0,.35)}
#veil.on{display:block}
.x{background:none;border:none;color:#9a8f80;font-size:24px;padding:0 6px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;padding:10px 16px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;background:#16130f;box-shadow:inset 0 0 0 1px #ff9f2e;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
#toast.on{opacity:1}
#warp{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:#000;overflow:hidden}
#warp.on{display:grid}
#warp .streaks{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(89,216,255,0) 0deg 3deg,rgba(89,216,255,.55) 3deg 3.4deg,rgba(255,159,46,0) 3.4deg 7deg,rgba(255,159,46,.4) 7deg 7.3deg);-webkit-mask:radial-gradient(circle,transparent 8%,#000 40%);mask:radial-gradient(circle,transparent 8%,#000 40%);animation:spin 3s linear infinite,zoomw 1.2s ease-in infinite}
@keyframes spin{to{transform:rotate(30deg)}}
@keyframes zoomw{from{scale:.9}to{scale:1.15}}
#warp .t{position:relative;text-align:center}
.cockpit{position:relative;height:200px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);background:#020306;box-shadow:inset 0 0 0 2px rgba(255,159,46,.5)}
.cockpit svg{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;font-size:10px;letter-spacing:2px;line-height:1.6;color:#59d8ff}
.gauge{padding:6px 0}.gauge b.h{font-size:11px}
.chip{display:inline-block;font-size:10px;letter-spacing:1px;padding:4px 8px;box-shadow:inset 0 0 0 1px rgba(255,159,46,.4);margin:2px 4px 2px 0}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;width:100%;text-align:left;border:none;color:inherit;font:inherit}
.opt[disabled]{opacity:.5;cursor:default}
@media (min-width:760px){#app{max-width:620px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a href="../" aria-label="Volver al menú">‹</a>
    <svg width="20" height="22" aria-hidden="true"><path d="M10 1 L19 6 V16 L10 21 L1 16 V6Z" fill="none" stroke="#ff9f2e" stroke-width="2"/><circle cx="10" cy="11" r="3" fill="#ff9f2e"/></svg>
    <span class="h" style="font-weight:900;font-size:14px;color:#ff9f2e;flex:1">Galaxia</span>
    <span class="st" id="st"></span>
  </div>
  <div class="p mis" id="mis"></div>
  <div id="view"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="veil"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="warp"><div class="streaks"></div><div class="t"><div class="lbl" style="color:#59d8ff">Motor de pliegue</div><div class="h" id="warpt" style="font-weight:900;font-size:22px;margin-top:6px">Plegando el espacio</div></div></div>
<script type="module" src="./ui.js?v=1795734178"></script>
</body>
</html>
