<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ludo · Juegos en casa</title>
<meta name="apple-mobile-web-app-title" content="Juegos">
<meta name="theme-color" content="#c99a5e">
<link rel="apple-touch-icon" href="../icon-180.png">
<script src="../supabase.js"></script>
<style>
@font-face{font-family:Sora;font-weight:600;font-display:swap;src:url(../fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:700;font-display:swap;src:url(../fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:800;font-display:swap;src:url(../fonts/sora-latin-800-normal.woff2) format("woff2")}
:root{--wood1:#c99a5e;--wood2:#b98748;--wood3:#d6aa6f;--ink:#1d1f23;--paper:#fbfbfa;--gold:#ffcf3f;
  --red:#e04545;--green:#2e9e4f;--yellow:#f0bd22;--blue:#2f6fd0}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--wood1)}
body{min-height:100vh;font-family:Sora,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding-bottom:120px;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(90,50,10,.07) 0 1px,transparent 1px 23px),linear-gradient(180deg,var(--wood3),var(--wood1) 40%,var(--wood2));background-attachment:fixed}
header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;max-width:560px;margin:0 auto;position:sticky;top:0;z-index:10;
  background:rgba(201,154,94,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:0 0 16px 16px}
.back,.gear{display:grid;place-items:center;width:36px;height:38px;flex:none;border-radius:12px;background:rgba(255,255,255,.85);color:var(--ink);text-decoration:none;font-size:22px;font-weight:800;border:none;font-family:inherit}
.gear{font-size:17px}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff;background:linear-gradient(90deg,var(--red),var(--green),var(--yellow),var(--blue));padding:5px 12px;border-radius:10px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sp{flex:1}
.pill{font-size:12px;font-weight:700;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 10px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
main{max-width:560px;margin:0 auto;padding:8px;display:grid;gap:10px}
.panel{background:var(--paper);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 20px rgba(40,30,20,.16);padding:16px}
.panel h2{font-size:18px;font-weight:800;margin-bottom:10px}
.muted{color:#6c6f75;font-size:14px}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{border:none;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;font-size:15px;background:#eeefef;color:var(--ink);cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:#24272d;color:#fff}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.wa{background:#25d366;color:#08331a}
.btn:disabled{opacity:.4}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid #d5d6d8;background:#fff;width:100%}
label.lbl{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#6c6f75;margin:4px 0 6px}
.tables{display:grid;gap:8px}
.btn.tbl{justify-content:space-between;background:#fff4d0;text-align:left}
.btn.tbl small,.btn.back2 small{font-weight:700;color:#6c6f75;font-size:12px}
.btn.back2{justify-content:space-between;background:#d9f2e1;text-align:left}
.mrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.mrow .del{border:none;border-radius:14px;width:46px;background:#eeefef;font:inherit;font-weight:800;font-size:16px;color:#6c6f75}
.code{display:grid;grid-template-columns:1fr auto;gap:8px}
.code input{text-transform:uppercase;letter-spacing:2px;font-weight:800}
.or{text-align:center;color:#6c6f75;font-weight:700;font-size:13px;margin:2px 0}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count .btn.on{background:#24272d;color:#fff}
.rules{font-size:13px;color:#4a4d53;line-height:1.5}
.rules li{margin-left:18px}
.seats{display:grid;gap:6px}
.seat{display:flex;align-items:center;gap:10px;background:#f1f1f0;border-radius:12px;padding:9px 12px;font-weight:700}
.dot{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.c0{background:var(--red)}.c1{background:var(--green)}.c2{background:var(--yellow)}.c3{background:var(--blue)}

/* players strip */
.who{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.who .p{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:5px 10px 5px 5px;font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.who .p.turn{box-shadow:0 0 0 3px var(--gold)}
.who .p small{color:#6c6f75;font-weight:700}

/* board */
.board{position:relative;width:var(--W);height:var(--W);margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 10px 26px rgba(40,20,0,.35),0 0 0 6px #5a3a20;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);overflow:hidden}
.cell{border:.5px solid #cfc8bb;position:relative}
.cell.h0,.cell.s0{background:var(--red)}.cell.h1,.cell.s1{background:var(--green)}.cell.h2,.cell.s2{background:var(--yellow)}.cell.h3,.cell.s3{background:var(--blue)}
.cell.h0,.cell.h1,.cell.h2,.cell.h3{opacity:.85}
.cell.star::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:#b9b2a3;font-size:calc(var(--cell)*.6)}
.cell.s0::after,.cell.s1::after,.cell.s2::after,.cell.s3::after{color:rgba(255,255,255,.85)}
.base{grid-row:span 6;grid-column:span 6;padding:calc(var(--cell)*.75)}
.base .in{background:#fff;width:100%;height:100%;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.base.b0{background:var(--red)}.base.b1{background:var(--green)}.base.b2{background:var(--yellow)}.base.b3{background:var(--blue)}
.center{grid-row:7 / span 3;grid-column:7 / span 3;background:conic-gradient(from 225deg,var(--green) 0 25%,var(--yellow) 0 50%,var(--blue) 0 75%,var(--red) 0)}
.tok{position:absolute;width:calc(var(--cell)*.78);height:calc(var(--cell)*.78);border-radius:50%;transform:translate(-50%,-50%);transition:left .25s,top .25s;z-index:2;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.4);border:2px solid #fff}
.tok.t0{background:var(--red)}.tok.t1{background:var(--green)}.tok.t2{background:var(--yellow)}.tok.t3{background:var(--blue)}
.tok.can{z-index:3;animation:bob .8s ease-in-out infinite;box-shadow:0 0 0 3px var(--gold),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.45);cursor:pointer}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.tok.moved{box-shadow:0 0 0 3px rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.4)}
.diebar{display:flex;align-items:center;justify-content:center;gap:14px;min-height:62px}
.die{width:54px;height:54px;border-radius:12px;background:#fffaf0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;box-shadow:0 3px 0 #c9b998,0 6px 12px rgba(0,0,0,.25)}
.die i{width:9px;height:9px;border-radius:50%;background:#1d1f23;place-self:center}
.die.roll{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-260deg) scale(.5)}100%{transform:none}}
.status{text-align:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(60,30,0,.5)}
.status small{display:block;font-weight:600;font-size:12px;opacity:.92}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(60,35,10,.55) 30%);display:flex;gap:8px;justify-content:center}
.actions:empty{display:none}
.actions .btn{flex:1;max-width:240px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.minor{display:flex;justify-content:center;gap:8px}
.minor button,.minor a{border:none;background:rgba(255,255,255,.7);border-radius:999px;padding:7px 12px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .in{background:var(--paper);border-radius:22px;padding:22px;max-width:340px;width:100%;text-align:center;display:grid;gap:10px}
.overlay .big{font-size:46px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
<script src="../perfil.js"></script>
<script src="../ayuda.js"></script>
</head>
<body>
<header>
  <a class="back" id="back" href="../" aria-label="Volver al menú de juegos">‹</a>
  <span class="logo">LUDO</span><span class="sp"></span>
  <span class="pill" id="pill"></span>
  <button class="gear" aria-label="Cómo jugar" onclick="Ayuda.open('ludo')" style="font-size:19px">?</button>
  <button class="gear" aria-label="Tu perfil" onclick="Perfil.open()">⚙</button>
</header>
<main id="app"></main>
<div class="actions" id="actions"></div>
<div id="toast"></div>
<script type="module">
import * as L from "./rules.js";
const SB_URL = "https://yfjaznujnvkqgdlbnviu.supabase.co";
const SB_KEY = "sb_publishable_HyGsQ2i78GnWfRDUsW3ByQ_SQ6dCy_S";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const me = Object.assign({ name: "", pid: null, pkey: null }, load("juegos-yo") || {});
if (!me.pid) { me.pid = uid(); me.pkey = uid() + uid(); }
store("juegos-yo", me);
document.addEventListener("perfil-cambio", (e) => { if (e.detail.name) me.name = e.detail.name; });
const keepHost = () => { const m = location.hash.match(/anfitrion=[A-Za-z0-9_-]{8,64}/); return m ? "&" + m[0] : ""; };
(() => { const k = keepHost(); if (k) $("#back").href = "../#" + k.slice(1); })();
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }
const pill = (t) => ($("#pill").textContent = t);
let sb = null;
const client = () => (sb || (window.supabase && (sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } }))));

/* ---------- state ---------- */
let mode = null, code = null, game = null, version = -1, lastSig = "", mySeat = -1, S = null, busy = false, rolled = false, autoT = null;
let localCount = 4;
const codeFromHash = () => { const m = location.hash.match(/(?:^#|&)l=([A-Z0-9]{4,10})/); return m ? m[1] : null; };
const seatName = (i) => (mode === "local" ? L.COLOR_NAME[S.colors[i]] : (game && game.seat_names[i]) || L.COLOR_NAME[S.colors[i]]);
const myTurn = () => S && S.phase !== "over" && S.phase !== "lobby" && (mode === "local" || S.turn === mySeat);

/* ---------- start ---------- */
function renderStart() {
  mode = null; pill("Elige cómo jugar"); $("#actions").innerHTML = "";
  $("#app").innerHTML = `<section class="panel stack">
      <h2>Ludo</h2>
      <p class="muted">De 2 a 4 jugadores, cada uno en su teléfono o todos en uno.</p>
      <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Magda" value="${esc(me.name)}"></div>
      <div id="open"></div>
      <button class="btn primary" id="online">Crear mesa nueva</button>
      <div><label class="lbl">En este teléfono</label>
        <div class="count">${[2, 3, 4].map((n) => `<button class="btn ${n === localCount ? "on" : ""}" data-n="${n}">${n} jugadores</button>`).join("")}</div></div>
      <button class="btn" id="local">Jugar en este teléfono</button>
      <div><label class="lbl" for="cod">¿Tienes el código de una mesa?</label>
        <div class="code"><input type="text" id="cod" maxlength="10" placeholder="Ej: K7MP2Q" autocapitalize="characters" autocomplete="off"><button class="btn" id="go-cod">Entrar</button></div></div>
    </section>
    <section class="panel rules"><b>Reglas</b><ul>
      <li>Cada uno tiene 4 fichas en su casa. Con un 6 sacas una ficha a la salida.</li>
      <li>Avanzas lo que dice el dado y das la vuelta al tablero hasta entrar por tu pasillo de color a la meta.</li>
      <li>Si caes donde hay una ficha rival, la mandas de vuelta a su casa; menos en las salidas y las estrellas ★.</li>
      <li>Con un 6, al comer o al llegar a la meta, vuelves a tirar. Tres 6 seguidos pierden el turno.</li>
      <li>Para entrar a la meta necesitas el número exacto. Gana quien lleva sus 4 fichas primero.</li></ul></section>`;
  $("#online").onclick = () => { if (takeName()) createOnline(); };
  document.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => { localCount = +b.dataset.n; document.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("on", x === b)); });
  $("#local").onclick = () => { takeName(true); startLocal(); };
  const goCode = () => {
    const c = ($("#cod").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-Z0-9]{4,10}$/.test(c)) return toast("Escribe el código de la mesa (6 letras o números)");
    if (!takeName()) return;
    location.hash = "l=" + c + keepHost();
  };
  $("#go-cod").onclick = goCode; $("#cod").onkeydown = (e) => { if (e.key === "Enter") goCode(); };
  listOpen();
}
function takeName(optional) {
  const v = ($("#nm").value || "").trim().slice(0, 24);
  if (!v && !optional) { $("#nm").focus(); toast("Escribe tu nombre"); return false; }
  if (v) { me.name = v; store("juegos-yo", Object.assign(load("juegos-yo") || {}, me)); }
  return true;
}
async function delTable(id) {
  if (!client()) return false;
  const { data, error } = await sb.rpc("ludo_delete", { p_id: id, p_player: me.pid, p_key: me.pkey });
  return !error && data === true;
}
let openT = null;
async function listOpen() {
  clearTimeout(openT);
  const box = $("#open"); if (!box || mode || !client()) return;
  const since = new Date(Date.now() - 12 * 3600 * 1000).toISOString(), fresh = Date.now() - 30 * 60 * 1000;
  const { data } = await sb.from("ludo_games").select("id,host_id,seat_ids,seat_names,updated_at,phase:state->>phase").gt("updated_at", since).order("updated_at", { ascending: false }).limit(40);
  if (!$("#open") || mode) return;
  const hidden = load("juegos-ocultas") || [];
  const all = data || [];
  const mine = all.filter((r) => r.seat_ids.includes(me.pid) && r.phase !== "over" && !hidden.includes(r.id)).slice(0, 4);
  const rows = all.filter((r) => r.phase === "lobby" && !r.seat_ids.includes(me.pid) && r.seat_ids.length < 4 && Date.parse(r.updated_at) > fresh);
  box.innerHTML = (mine.length ? `<label class="lbl">Tus partidas</label><div class="tables">${mine.map((r) => `
      <div class="mrow"><button class="btn back2" data-join="${esc(r.id)}"><span>${r.phase === "lobby" ? "Volver a tu mesa" : "Volver a la partida"} · ${esc(r.id)}</span><small>${r.phase === "lobby" ? "esperando" : "en juego"} · ${r.seat_ids.length} jug.</small></button>
      <button class="del" data-del="${esc(r.id)}" data-own="${r.phase === "lobby" && r.host_id === me.pid ? "1" : ""}" aria-label="Borrar o quitar">✕</button></div>`).join("")}</div>` : "")
    + (rows.length ? `<label class="lbl">Mesas esperando jugadores</label><div class="tables">${rows.map((r) => `
      <button class="btn tbl" data-join="${esc(r.id)}"><span>Unirse a la mesa de ${esc(r.seat_names[0] || "alguien")}</span><small>${r.seat_ids.length} ${r.seat_ids.length === 1 ? "persona" : "personas"}</small></button>`).join("")}</div>` : "")
    + (mine.length || rows.length ? `<div class="or">o</div>` : "");
  box.querySelectorAll("[data-join]").forEach((b) => b.onclick = () => { if (!takeName()) return; location.hash = "l=" + b.dataset.join + keepHost(); });
  box.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.del;
    if (b.dataset.own && (await delTable(id))) toast("Mesa borrada");
    else { store("juegos-ocultas", [id].concat(load("juegos-ocultas") || []).slice(0, 40)); toast("La quitamos de tu lista"); }
    listOpen();
  });
  openT = setTimeout(listOpen, 4000);
}

/* ---------- local ---------- */
function startLocal() { mode = "local"; game = null; mySeat = -1; S = L.newState(localCount); pill("Mismo teléfono"); render(); }

/* ---------- online ---------- */
function newCode() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
async function createOnline() {
  if (!client()) return toast("Sin conexión");
  for (let i = 0; i < 3; i++) {
    const c = newCode();
    const { error } = await sb.rpc("ludo_create", { p_id: c, p_player: me.pid, p_key: me.pkey, p_name: me.name });
    if (!error) { location.hash = "l=" + c + keepHost(); return; }
    if (!String(error.message || "").includes("duplicate")) return toast("No se pudo crear la mesa");
  }
}
async function openOnline(c) {
  mode = "online"; code = c;
  if (!client()) { $("#app").innerHTML = `<section class="panel">Sin conexión. Revisa internet y vuelve a abrir el link.</section>`; return; }
  if (!me.name) return renderJoin(c);
  const { data, error } = await sb.rpc("ludo_join", { p_id: c, p_player: me.pid, p_key: me.pkey, p_name: me.name });
  if (error) { $("#app").innerHTML = `<section class="panel stack"><h2>No encontré esa mesa</h2><p class="muted">Puede que haya expirado. Crea una nueva.</p><a class="btn primary" href="./">Nueva mesa</a></section>`; return; }
  mySeat = data;
  await refresh(true);
  subscribe();
}
function renderJoin(c) {
  pill("Te invitaron");
  $("#app").innerHTML = `<section class="panel stack"><h2>Te invitaron a jugar ludo</h2>
    <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Rodrigo"></div>
    <button class="btn primary" id="go">Entrar</button></section>`;
  const go = () => { if (takeName()) openOnline(c); };
  $("#go").onclick = go; $("#nm").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
async function refresh(force) {
  const { data, error } = await sb.from("ludo_games").select("*").eq("id", code).maybeSingle();
  if (error || !data) return;
  const sig = [data.version, data.seat_ids.join(), data.seat_names.join()].join("|");
  if (!force && sig === lastSig) return;
  lastSig = sig;
  const prev = S;
  game = data; S = data.state; version = data.version;
  mySeat = data.seat_ids.indexOf(me.pid);
  if (S.phase === "over" && prev && prev.phase !== "over") setTimeout(celebrate, 400);
  render();
}
let watching = false;
function subscribe() {
  if (watching) return; watching = true;
  sb.channel("ludo-" + code).on("postgres_changes", { event: "*", schema: "public", table: "ludo_games", filter: "id=eq." + code }, () => refresh()).subscribe();
  setInterval(() => { if (!document.hidden && !busy) refresh(); }, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}

/* ---------- a turn ---------- */
async function roll() {
  if (busy || !myTurn() || S.phase !== "roll") return;
  rolled = true;
  if (mode === "local") { S = { ...S, phase: "move", dice: 1 + Math.floor(Math.random() * 6) }; return render(); }
  busy = true;
  const { error } = await sb.rpc("ludo_roll", { p_id: code, p_player: me.pid, p_key: me.pkey, p_version: version });
  busy = false;
  if (error) toast(String(error.message).includes("stale") ? "Se actualizó el tablero; intenta de nuevo" : "No se pudo tirar");
  await refresh(true);
}
async function commit(next) {
  clearTimeout(autoT);
  if (mode === "local") { S = next; render(); if (S.phase === "over") celebrate(); return; }
  busy = true;
  const { error } = await sb.rpc("ludo_move", { p_id: code, p_player: me.pid, p_key: me.pkey, p_state: next, p_version: version });
  busy = false;
  if (error) toast(String(error.message).includes("stale") ? "El tablero cambió; intenta de nuevo" : "No se pudo mover");
  await refresh(true);
  if (S.phase === "over") celebrate();
}
function choose(t) {
  if (!myTurn() || S.phase !== "move" || busy) return;
  const r = L.afterRoll(S, S.dice);
  const m = (r.moves || []).find((x) => x.t === t);
  if (!m) return toast("Esa ficha no se puede mover con un " + S.dice);
  commit(L.play(S, m, S.dice));
}

/* ---------- drawing ---------- */
function boardHTML(moving) {
  const W = Math.min(window.innerWidth, 560) - 16 - 12, cell = W / 15;
  const track = new Map(L.PATH.map((p, i) => [p.join(), i]));
  const homes = new Map(); L.HOME.forEach((col, c) => col.slice(0, 5).forEach((p) => homes.set(p.join(), c)));
  let cells = "";
  // the four bases and the centre are big blocks; the rest are single squares
  const bases = [[1, 1, 0], [1, 10, 1], [10, 10, 2], [10, 1, 3]];
  for (const [r, c, k] of bases) cells += `<div class="base b${k}" style="grid-row:${r} / span 6;grid-column:${c} / span 6"><div class="in"></div></div>`;
  cells += `<div class="center"></div>`;
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
    const inBase = (r < 6 || r > 8) && (c < 6 || c > 8), inCenter = r >= 6 && r <= 8 && c >= 6 && c <= 8;
    if (inBase || inCenter) continue;
    const key = r + "," + c, i = track.get(key);
    let cls = "cell";
    if (i !== undefined) { const st = L.START.indexOf(i); if (st >= 0) cls += " s" + st; if (L.SAFE.has(i)) cls += " star"; }
    if (homes.has(key)) cls += " h" + homes.get(key);
    cells += `<div class="${cls}" style="grid-row:${r + 1};grid-column:${c + 1}"></div>`;
  }
  // tokens, nudged apart when they share a square
  const spots = new Map(), toks = [];
  S.tokens.forEach((list, seat) => list.forEach((p, k) => {
    const color = S.colors[seat];
    const [r, c] = p === 56 ? [[7, 6.2], [6.2, 7], [7, 7.8], [7.8, 7]][color] : L.cellOf(color, p, k);
    const key = r + "," + c; const n = spots.get(key) || 0; spots.set(key, n + 1);
    toks.push({ seat, k, color, r, c, n, p });
  }));
  const nudge = [[0, 0], [0.22, 0.22], [-0.22, -0.22], [0.22, -0.22], [-0.22, 0.22], [0, 0.3], [0.3, 0], [-0.3, 0]];
  const last = S.last && !S.last.pass ? S.last : null;
  const tokHTML = toks.map((t) => {
    const [dy, dx] = (spots.get(t.r + "," + t.c) > 1 ? nudge[t.n % nudge.length] : [0, 0]);
    const can = moving && moving.has(t.seat + ":" + t.k);
    const mv = last && last.seat === t.seat && last.t === t.k;
    return `<span class="tok t${t.color} ${can ? "can" : ""} ${mv ? "moved" : ""}" data-s="${t.seat}" data-k="${t.k}" style="left:${(t.c + 0.5 + dx) * cell}px;top:${(t.r + 0.5 + dy) * cell}px"></span>`;
  }).join("");
  return `<div class="board" style="--W:${W}px;--cell:${cell}px">${cells}${tokHTML}</div>`;
}
function dieHTML(n, anim) {
  const P = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] }[n];
  return `<span class="die ${anim ? "roll" : ""}">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((k) => (P.includes(k) ? `<i style="grid-area:${Math.ceil(k / 3)}/${((k - 1) % 3) + 1}"></i>` : `<b></b>`)).join("")}</span>`;
}
function render() {
  if (!S) return;
  if (S.phase === "lobby") return renderLobby();
  clearTimeout(autoT);
  const mine = myTurn();
  let moving = null, info = null;
  if (mine && S.phase === "move") {
    info = L.afterRoll(S, S.dice);
    if (info.moves) moving = new Set(info.moves.map((m) => S.turn + ":" + m.t));
  }
  const name = (i) => (mode === "online" && i === mySeat ? "Tú" : esc(seatName(i)));
  let status = "", sub = "";
  if (S.phase === "over") status = mode === "online" && S.winner === mySeat ? "¡Ganaste!" : "Ganó " + esc(seatName(S.winner));
  else if (!mine) status = "Turno de " + esc(seatName(S.turn));
  else if (S.phase === "roll") status = mode === "local" ? "Turno de " + esc(seatName(S.turn)) + ": tira el dado" : "Tu turno: tira el dado";
  else if (info && info.pass) { status = info.pass === "tres seises" ? "¡Tres 6 seguidos! Pierdes el turno" : "Con un " + S.dice + " no puedes mover"; }
  else status = "Toca la ficha que quieres mover";
  const L2 = S.last;
  if (L2 && S.phase !== "over") {
    if (L2.pass) sub = `${name(L2.seat)} ${L2.pass === "tres seises" ? "sacó tres 6 y perdió el turno" : "no pudo mover con un " + L2.d}`;
    else if (L2.captured) sub = `¡${name(L2.seat)} se comió una ficha!`;
    else if (L2.to === 56) sub = `${name(L2.seat)} llevó una ficha a la meta`;
    else if (L2.from === -1) sub = `${name(L2.seat)} sacó una ficha`;
    if (S.phase === "roll" && L2.seat === S.turn && !L2.pass) sub += (sub ? " · " : "") + "vuelve a tirar";
  }
  $("#app").innerHTML = `
    <div class="who">${S.tokens.map((toks, i) => `<span class="p ${S.phase !== "over" && S.turn === i ? "turn" : ""}"><span class="dot c${S.colors[i]}"></span>${name(i)} <small>${toks.filter((p) => p === 56).length}/4</small></span>`).join("")}</div>
    ${boardHTML(moving)}
    <div class="diebar">${S.dice ? dieHTML(S.dice, rolled) : S.last && S.last.d ? `<span style="opacity:.45">${dieHTML(S.last.d)}</span>` : ""}
      <div class="status" style="text-align:left">${status}${sub ? `<small>${sub}</small>` : ""}</div></div>
    ${mode ? `<div class="minor">${mode === "local" ? `<button id="restart">Nueva partida</button>` : ""}<a href="./${keepHost() ? "#" + keepHost().slice(1) : ""}">Salir</a></div>` : ""}`;
  rolled = false;
  $("#app").querySelectorAll(".tok.can").forEach((el) => el.onclick = () => choose(+el.dataset.k));
  const rt = $("#restart"); if (rt) rt.onclick = () => { if (rt.dataset.sure !== "1") { rt.dataset.sure = "1"; rt.textContent = "¿Seguro? Toca otra vez"; return; } startLocal(); };
  if (mode === "online") Perfil.turn(mine);
  pill(mode === "local" ? "Mismo teléfono" : "Mesa " + code);
  // the bar
  const a = $("#actions");
  if (S.phase === "over") {
    const can = mode === "local" || (game && game.host_id === me.pid);
    a.innerHTML = can ? `<button class="btn gold" id="again">Jugar otra vez</button>` : "";
    const g = $("#again"); if (g) g.onclick = again;
  } else if (mine && S.phase === "roll") { a.innerHTML = `<button class="btn gold" id="roll">🎲 Tirar el dado</button>`; $("#roll").onclick = roll; }
  else a.innerHTML = "";
  // nothing to choose: pass on by itself; a single choice moves by itself
  if (mine && info) {
    if (info.pass) autoT = setTimeout(() => commit(L.pass(S, S.dice, info.pass)), 1500);
    else if (info.moves.length === 1) autoT = setTimeout(() => commit(L.play(S, info.moves[0], S.dice)), 900);
  }
}
function renderLobby() {
  const isHost = game.host_id === me.pid, n = game.seat_ids.length, cols = L.colorsFor(Math.max(n, 2));
  pill("Mesa " + code);
  $("#app").innerHTML = `<section class="panel stack"><h2>Mesa ${code}</h2>
      <div class="seats">${game.seat_names.map((nm, i) => `<div class="seat"><span class="dot c${cols[i] ?? i}"></span>${esc(nm)}${i === mySeat ? " (tú)" : ""}<span class="sp"></span><span class="muted">${i === 0 ? "creó la mesa" : ""}</span></div>`).join("")}</div>
      <p class="muted">${n < 2 ? "Invita al menos a una persona (hasta 4)." : isHost ? "Cuando estén todos, empieza." : "Esperando que " + esc(game.seat_names[0]) + " empiece."}</p>
      <div class="two"><button class="btn primary" id="copy">🔗 Copiar link</button><a class="btn wa" target="_blank" rel="noopener" href="${waLink()}">WhatsApp</a></div>
      ${isHost ? `<button class="btn" id="delt" style="background:none;color:#a3262f;min-height:36px">Borrar esta mesa</button>` : ""}
    </section>`;
  $("#copy").onclick = copyLink;
  const dt = $("#delt"); if (dt) dt.onclick = async () => {
    if (dt.dataset.sure !== "1") { dt.dataset.sure = "1"; dt.textContent = "¿Seguro? Toca otra vez para borrarla"; return; }
    if (await delTable(code)) location.href = "./" + (keepHost() ? "#" + keepHost().slice(1) : ""); else toast("No se pudo borrar");
  };
  $("#actions").innerHTML = isHost ? `<button class="btn gold" id="start" ${n < 2 ? "disabled" : ""}>Empezar partida (${n})</button>` : "";
  const st = $("#start"); if (st) st.onclick = again;
}
async function again() {
  if (mode === "local") return startLocal();
  if (busy) return; busy = true;
  const { error } = await sb.rpc("ludo_start", { p_id: code, p_player: me.pid, p_key: me.pkey, p_state: L.newState(game.seat_ids.length) });
  busy = false;
  if (error) toast("No se pudo empezar");
  await refresh(true);
}
function celebrate() {
  if (document.querySelector(".overlay")) return;
  const won = mode === "local" || S.winner === mySeat;
  const el = document.createElement("div"); el.className = "overlay";
  el.innerHTML = `<div class="in"><div class="big">${won ? "🏆" : "🎲"}</div><h2>${mode === "online" ? (won ? "¡Ganaste!" : "Ganó " + esc(seatName(S.winner))) : "Ganó " + esc(seatName(S.winner))}</h2>
    <p class="muted">Llevó sus 4 fichas a la meta.</p><button class="btn primary" id="ok">Ver tablero</button></div>`;
  document.body.appendChild(el);
  el.querySelector("#ok").onclick = () => el.remove();
}

/* ---------- invitations ---------- */
const playLink = () => location.origin + location.pathname + "#l=" + code;
const inviteText = () => "¿Jugamos ludo? Entra aquí: " + playLink();
const waLink = () => "https://wa.me/?text=" + encodeURIComponent(inviteText());
async function copyLink() {
  try { await navigator.clipboard.writeText(inviteText()); return toast("Link copiado; pégalo en WhatsApp"); } catch (e) {}
  try { const ta = document.createElement("textarea"); ta.value = inviteText(); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Link copiado"); }
  catch (e) { toast("No se pudo copiar; usa WhatsApp"); }
}

/* ---------- boot ---------- */
window.addEventListener("resize", () => mode && S && S.phase !== "lobby" && render());
const c0 = codeFromHash();
if (c0) openOnline(c0); else renderStart();
window.addEventListener("hashchange", () => { const c = codeFromHash(); if (c !== code) location.reload(); });
</script>
</body>
</html>
