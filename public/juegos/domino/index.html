<header>
  <a class="back" id="back" href="../" aria-label="Volver al menú de juegos">‹</a>
  <span class="logo" style="background:#1d1f23;color:#fff;white-space:nowrap;font-size:17px">DOMINÓ</span><span class="sp"></span>

  <button class="gear" aria-label="Cómo jugar" onclick="Ayuda.open('domino')" style="font-size:19px">?</button>

<script type="module">
import * as O from "./engine.js";
/* ---------- against the machine ---------- */
function applyLocal(s, pi, action, b, rand) {
  if (action === "start") return O.start(s, pi, rand);
  if (action === "act") return O.act(s, pi, { action: b.move, tile: b.tile, side: b.side }, rand);
  const e = new Error("Acción desconocida"); e.user = true; throw e;
}
// easy plays any tile that fits; medium gets rid of heavy tiles and doubles first;
// hard also leaves open ends it still holds tiles for, so the rival runs out of moves
function botLocal(s, pi, lv) {
  if (s.phase !== "playing" || s.stage !== "hand" || s.turn !== pi) return null;
  const hand = s.players[pi].hand, can = O.playable(hand, s.ends, s.must);
  if (!can.length) return { action: "act", move: s.boneyard.length ? "draw" : "pass" };
  const opts = [];
  for (const t of can) for (const side of O.fits(t, s.ends)) opts.push({ t, side });
  if (lv <= 1) { const o = opts[Math.floor(Math.random() * opts.length)]; return { action: "act", move: "play", tile: o.t, side: o.side }; }
  const score = ({ t, side }) => {
    const [x, y] = O.halves(t);
    let v = O.pips(t) + (O.isDouble(t) ? 4 : 0);
    if (lv >= 3 && s.ends) {
      const end = side === "L" ? s.ends[0] : s.ends[1], open = x === end ? y : x;
      const other = side === "L" ? s.ends[1] : s.ends[0], rest = hand.filter((h) => h !== t);
      v += 3 * rest.filter((h) => O.halves(h).includes(open)).length + 1.5 * rest.filter((h) => O.halves(h).includes(other)).length;
    }
    return v;
  };
  const o = opts.sort((a, b) => score(b) - score(a))[0];
  return { action: "act", move: "play", tile: o.t, side: o.side };
}
function startMachine(lv, st) {
  cpuLv = lv;
  local = Local.table({ E: O, apply: applyLocal, bot: botLocal, level: lv, key: "domino", state: st, opponents: 1, me, onChange: (v) => show(v) });
  code = "MAQ";
  const v = local.call(st ? "view" : "start"); if (v && !v.error) show(v);
}

const GAME = "domino";
const SB_URL = "https://yfjaznujnvkqgdlbnviu.supabase.co";
const SB_KEY = "sb_publishable_HyGsQ2i78GnWfRDUsW3ByQ_SQ6dCy_S";
const FN = SB_URL + "/functions/v1/domino";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const me = Object.assign({ name: "", pid: null, pkey: null }, load("juegos-yo") || {});
if (!me.name) { const b = load("bingo-casa-v1"); if (b && b.name) me.name = b.name; }
if (!me.pid) { me.pid = uid(); me.pkey = uid() + uid(); }
store("juegos-yo", me);
(() => { const m = location.hash.match(/anfitrion=[A-Za-z0-9_-]{8,64}/); if (m) $("#back").href = "../#" + m[0]; })();

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }
const pill = (t) => ($("#pill").textContent = t);
let sb = null;
let local = null, cpuLv = 0;           // a table against the machine, only on this phone

/* ---------- server ---------- */
async function call(action, extra = {}) {
  if (local) { const v = local.call(action, extra); if (v && v.error) { toast(v.error); return null; } return v; }
  try {
    const r = await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY },
      body: JSON.stringify(Object.assign({ action, code, player: me.pid, key: me.pkey, name: me.name }, extra)) });
    const j = await r.json();
    if (j.error) { toast(j.error); return null; }
    return j;
  } catch (e) { toast("Sin conexión"); return null; }
}

/* ---------- state ---------- */
let code = null, V = null, lastVersion = -1;
let busy = false;
const codeFromHash = () => { const m = location.hash.match(/(?:^#|&)m=([A-Z0-9]{4,10})/); return m ? m[1] : null; };
const keepHost = () => { const m = location.hash.match(/anfitrion=[A-Za-z0-9_-]{8,64}/); return m ? "&" + m[0] : ""; };

/* ---------- start / lobby ---------- */
function renderStart() {
  pill("Cartas");
  $("#bar").innerHTML = "";
  $("#app").innerHTML = `<section class="panel stack">
      <h2>Dominó</h2>
      <p class="muted">Doble seis, de 2 a 4 jugadores, cada uno en su teléfono. Con 4 se juega en parejas. Se juega a 100 puntos.</p>
      <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Magda" value="${esc(me.name)}"></div>
      <div id="mine"></div>
      <div id="open"></div>
      ${Local.resumeHTML("domino")}${Maquina.html({ note: "Juegas contra la máquina en este teléfono." })}
      <button class="btn primary" id="create">Crear mesa nueva</button>
      <div><label class="lbl" for="cod">¿Tienes el código de una mesa?</label>
        <div class="code"><input type="text" id="cod" maxlength="10" placeholder="Ej: 3WFVTE" autocapitalize="characters" autocomplete="off"><button class="btn" id="go-cod">Entrar</button></div></div>
    </section>
    <section class="panel help"><b>Cómo se juega</b><ul>
      <li>Cada uno recibe 7 fichas. La primera mano la abre quien tiene el doble más alto.</li>
      <li>Por turno pones una ficha que calce con una de las dos puntas de la mesa.</li>
      <li>Si no tienes, con 2 o 3 jugadores robas del pozo; con 4 (en parejas) pasas.</li>
      <li>Quien se queda sin fichas gana los puntos de las fichas que les quedan a los rivales. Si nadie puede jugar (tranque), gana quien suma menos.</li></ul></section>`;
  $("#create").onclick = async () => {
    if (!takeName()) return;
    const v = await call("create", { game: GAME }); if (!v) return;
    remember(v.code);
    code = v.code; location.hash = "m=" + code + keepHost(); show(v); watch();
  };
  const goCode = () => {
    const c = ($("#cod").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-Z0-9]{4,10}$/.test(c)) return toast("Escribe el código de la mesa (6 letras o números)");
    if (!takeName()) return;
    location.hash = "m=" + c + keepHost();
  };
  $("#go-cod").onclick = goCode; $("#cod").onkeydown = (e) => { if (e.key === "Enter") goCode(); };
  Maquina.bind($("#app"), (lv) => { if (takeName()) startMachine(lv); });
  Local.bindResume($("#app"), "domino", (d) => { if (takeName()) startMachine(d.level, d.s); });
  listMine();
  listOpen();
}
const hide = (id) => store("juegos-ocultas", [id].concat(load("juegos-ocultas") || []).slice(0, 40));
async function delTable(id) {
  if (!client()) return false;
  const { data, error } = await sb.rpc("naipe_delete", { p_id: id, p_player: me.pid, p_key: me.pkey });
  return !error && data === true;
}
/* the tables you are already in come first, so leaving and coming back is one tap */
async function listMine() {
  const box = $("#mine");
  if (!box || !client()) return;
  const since = new Date(Date.now() - 12 * 3600 * 1000).toISOString();
  const { data } = await sb.from("naipe_pulse").select("id,host_name,phase,players,updated_at").eq("game", GAME).contains("player_ids", [me.pid]).in("phase", ["lobby", "playing"]).gt("updated_at", since).order("updated_at", { ascending: false }).limit(5);
  if (!$("#mine")) return;
  const hidden = load("juegos-ocultas") || [];
  const rows = (data || []).filter((r) => !hidden.includes(r.id));
  mineOpen = new Set(rows.map((r) => r.id));
  box.innerHTML = rows.length ? `<label class="lbl">Tus partidas</label><div class="tables">${rows.map((r) => `
      <div class="mrow"><button class="btn back2" data-back="${esc(r.id)}"><span>${r.phase === "lobby" ? "Volver a tu mesa" : "Volver a la partida"}${r.host_name && r.host_name !== me.name ? " de " + esc(r.host_name) : ""} · ${esc(r.id)}</span>
      <small>${r.phase === "lobby" ? "esperando" : "en juego"} · ${r.players} jug.</small></button><button class="del" data-del="${esc(r.id)}" data-ph="${r.phase}" aria-label="Cerrar o quitar esta mesa">✕</button></div>`).join("")}</div>` : "";
  box.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.del;
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro?"; b.classList.add("sure"); return; }
    if (await delTable(id)) toast("Mesa cerrada");
    else { hide(id); toast("La quitamos de tu lista"); }
    listMine();
  });
  box.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { location.hash = "m=" + b.dataset.back + keepHost(); });
  listOpen();
}
let mineOpen = new Set();
const client = () => (sb || (window.supabase && (sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } }))));
/* tables waiting for players: join one, or create a new one */
const mine0 = () => load("domino-mias") || [];
function remember(c) { store("domino-mias", [c].concat(mine0().filter((x) => x !== c)).slice(0, 10)); }
let openT = null;
async function listOpen() {
  clearTimeout(openT);
  const box = $("#open"); if (!box) return;
  if (!sb && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  if (!sb) return;
  const since = new Date(Date.now() - 30 * 60 * 1000).toISOString();
  const { data } = await sb.from("naipe_pulse").select("id,host_name,players,updated_at").eq("game", GAME).eq("phase", "lobby").gt("updated_at", since).order("updated_at", { ascending: false }).limit(15);
  if (!$("#open")) return;
  const hid = load("juegos-ocultas") || [];
  const rows = (data || []).filter((r) => r.players < O.MAX_PLAYERS && !mineOpen.has(r.id) && !hid.includes(r.id));
  const mine = mine0();
  box.innerHTML = rows.length ? `<label class="lbl">Mesas esperando jugadores</label><div class="tables">${rows.map((r) => `
      <button class="btn tbl" data-join="${esc(r.id)}"><span>${mine.includes(r.id) ? "Volver a tu mesa" : "Unirse a la mesa de " + esc(r.host_name || "alguien")}</span>
      <small>${r.players} ${r.players === 1 ? "persona" : "personas"}</small></button>`).join("")}</div>
      <div class="or">o</div>` : "";
  box.querySelectorAll("[data-join]").forEach((b) => b.onclick = async () => {
    if (!takeName()) return;
    code = b.dataset.join;
    const v = await call("join"); if (!v) { code = null; return listOpen(); }
    location.hash = "m=" + code + keepHost(); show(v); watch();
  });
  openT = setTimeout(listOpen, 4000);
}
function takeName() {
  const v = ($("#nm").value || "").trim().slice(0, 24);
  if (!v) { $("#nm").focus(); toast("Escribe tu nombre"); return false; }
  me.name = v; store("juegos-yo", me); return true;
}
async function openTable(c) {
  code = c;
  const v = await call("view");
  if (!v) { $("#app").innerHTML = `<section class="panel stack"><h2>No encontré esa mesa</h2><a class="btn primary" href="./">Crear una nueva</a></section>`; return; }
  if (v.outsider) return renderJoin(v);
  show(v); watch();
}
function renderJoin(v) {
  pill("Te invitaron");
  $("#bar").innerHTML = "";
  if (v.phase !== "lobby") { $("#app").innerHTML = `<section class="panel stack"><h2>Esta mesa ya empezó</h2><p class="muted">Pide que te inviten a la próxima.</p><a class="btn primary" href="./">Crear una mesa</a></section>`; return; }
  $("#app").innerHTML = `<section class="panel stack"><h2>Te invitaron a jugar dominó</h2>
    <p class="muted">En la mesa: ${v.players.map(esc).join(", ")}</p>
    <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Rodrigo" value="${esc(me.name)}"></div>
    <button class="btn primary" id="go">Sentarme a la mesa</button></section>`;
  $("#go").onclick = async () => { if (!takeName()) return; const j = await call("join"); if (j) { show(j); watch(); } };
}

/* ---------- live updates: a tiny public version number says when to ask for a fresh view ---------- */
let watching = false;
function watch() {
  if (watching) return; watching = true;
  if (window.supabase) {
    if (!sb) sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
    sb.channel("domino-" + code).on("postgres_changes", { event: "*", schema: "public", table: "naipe_pulse", filter: "id=eq." + code }, () => poll()).subscribe();
  }
  setInterval(() => { if (!document.hidden) poll(); }, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}
async function poll() {
  if (busy || !sb) return;
  const { data } = await sb.from("naipe_pulse").select("version").eq("id", code).maybeSingle();
  if (data && data.version !== lastVersion) { const v = await call("view"); if (v && !v.outsider) show(v); }
}

/* ---------- render ---------- */
function show(v) {
  if (code && !local && (!V || V.code !== v.code)) remember(code);
  const was = V;
  V = v; lastVersion = v.version;
  if (V.phase === "lobby") return renderLobby();
  renderTable(was);
}
function renderLobby() {
  const isHost = V.players[V.me].host;
  pill(local ? "🤖 " + Maquina.label(cpuLv) : "Mesa " + code);
  $("#app").innerHTML = `<section class="panel stack"><h2>Mesa ${code}</h2>
      <div class="plist">${V.players.map((p, i) => `<div><span>${esc(p.name)}${i === V.me ? " (tú)" : ""}</span><span class="muted">${p.host ? "creó la mesa" : ""}</span></div>`).join("")}</div>
      <p class="muted">${V.players.length < 2 ? "Invita al menos a una persona." : isHost ? "Cuando estén todos, empieza." : "Esperando que " + esc(V.players.find((p) => p.host).name) + " empiece."}</p>
      <div class="two"><button class="btn primary" id="copy">🔗 Copiar link</button><a class="btn wa" target="_blank" rel="noopener" href="${waLink()}">WhatsApp</a></div>
      ${isHost ? `<button class="btn" id="del" style="background:none;color:#a3262f;min-height:36px">Borrar esta mesa</button>` : ""}
    </section>`;
  const dl = $("#del");
  if (dl) dl.onclick = async () => {
    if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "¿Seguro? Toca otra vez para borrarla"; return; }
    if (await delTable(code)) { location.href = "./" + (keepHost() ? "#" + keepHost().slice(1) : ""); } else toast("No se pudo borrar");
  };
  $("#copy").onclick = copyLink;
  $("#bar").innerHTML = "";
  // the start button sits in the table card, right under the invite buttons
  if (isHost) $("#app .two").insertAdjacentHTML("afterend", `<button class="btn gold" id="start" ${V.players.length < 2 ? "disabled" : ""}>Empezar partida (${V.players.length})</button>`);
  const s = $("#start"); if (s) s.onclick = () => act("start");
}
let selTile = null;
const PIPS = { 0: [], 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
const half = (n) => `<i class="hf">${PIPS[n].map((k) => `<b style="grid-area:${Math.ceil(k / 3)}/${((k - 1) % 3) + 1}"></b>`).join("")}</i>`;
// a tile: horizontal on the table (doubles stand across), vertical in the hand
// the table's tiles take the biggest size that still lets the whole game fit on the screen without scrolling
function fitLine() {
  const line = document.querySelector(".line"); if (!line) return;
  const bar = document.querySelector(".bar");
  for (let u = 40; u >= 14; u -= 2) {
    line.style.setProperty("--u", u + "px");
    if (document.documentElement.scrollHeight <= window.innerHeight - (bar ? bar.offsetHeight : 0) + 2) return;
  }
}
window.addEventListener("resize", () => fitLine());
const tileHTML = (a, b, cls = "", attrs = "") => `<span class="dm ${cls}" ${attrs}>${half(a)}<span class="mid"></span>${half(b)}</span>`;
function renderTable(was) {
  const me = V.players[V.me], hand = V.stage === "hand", myTurn = V.phase === "playing" && hand && V.turn === V.me;
  if (window.Perfil) Perfil.turn(myTurn);
  pill(local ? "🤖 " + Maquina.label(cpuLv) : "Mesa " + code);
  if (!myTurn || (selTile && !(me.hand || []).includes(selTile))) selTile = null;
  const teamTag = (i) => (V.teams ? `<span class="tm t${i % 2}">${i % 2 === V.me % 2 ? "pareja" : "rival"}</span>` : "");
  const opps = V.players.map((p, i) => ({ p, i })).filter((x) => x.i !== V.me);
  const can = new Set(V.canPlay || []);
  const lastTile = V.last && V.last.tile;
  const line = V.line.map(([a, b], k) => {
    const isLast = lastTile && ((k === 0 && V.last.side === "L") || (k === V.line.length - 1 && V.last.side === "R") || (V.line.length === 1));
    return tileHTML(a, b, (a === b ? "v" : "h") + (isLast ? " last" : ""));
  }).join("");
  const sides = selTile ? O.fits(selTile, V.ends) : [];
  let status = "";
  if (V.phase === "finished") status = `🏆 ${V.teams ? (V.winner === V.me % 2 ? "¡Ganaron ustedes!" : "Ganó la otra pareja") : V.winner === V.me ? "¡Ganaste la partida!" : "Ganó " + esc(V.players[V.winner].name)}`;
  else if (V.stage === "result") status = V.log[0] || "Fin de la mano";
  else if (!myTurn) status = `Turno de ${esc(V.players[V.turn].name)}`;
  else if (V.must) status = `Sales tú con el doble ${V.must.split("-")[0]}`;
  else if (can.size) status = selTile && sides.length > 1 ? "¿En qué punta la pones?" : "Tu turno: toca una ficha marcada";
  else status = V.boneyard ? "No tienes ficha: roba del pozo" : "No tienes ficha: pasa";
  const lastTxt = V.last && hand ? (V.last.passed ? `${esc(V.players[V.last.by].name)} pasó` : V.last.drew ? `${esc(V.players[V.last.by].name)} robó del pozo` : "") : "";
  $("#app").innerHTML = `
    <div class="opps">${opps.map(({ p, i }) => `<div class="opp ${V.turn === i && hand ? "turn" : ""}"><span class="n">${esc(p.name)}</span>${teamTag(i)}
      <span class="cnt">🁢 ${p.count}</span><span class="muted">${p.score} pts</span></div>`).join("")}</div>
    <div class="felt dline">${V.line.length ? `<div class="line">${line}</div>` : `<span class="empty">${hand ? "La mesa está vacía" : ""}</span>`}
      ${V.ends ? `<div class="ends"><span>◀ ${V.ends[0]}</span><span>${V.boneyard ? "Pozo: " + V.boneyard : V.teams ? "En parejas" : "Sin pozo"}</span><span>${V.ends[1]} ▶</span></div>` : V.boneyard ? `<div class="ends"><span></span><span>Pozo: ${V.boneyard}</span><span></span></div>` : ""}</div>
    <div class="status">${status}${lastTxt ? `<small>${lastTxt}</small>` : ""}</div>
    ${V.stage === "result" || V.phase === "finished" ? resultHTML() : ""}
    <div class="mine">
      <div class="tools"><span>Tus fichas · ${me.score} pts${V.teams ? " (pareja)" : ""}</span><span>a ${O.TARGET}</span></div>
      <div class="dhand" id="hand">${(me.hand || []).map((t) => { const [a, b] = O.halves(t); return tileHTML(a, b, "v hd" + (can.has(t) ? " ok" : myTurn ? " dim" : "") + (selTile === t ? " sel" : ""), `data-t="${t}"`); }).join("")}</div>
    </div>
    <div class="log">Mano ${V.round + 1} · ${(V.log || []).slice(0, 2).map(esc).join(" · ")}</div>`;
  fitLine();
  $("#hand").querySelectorAll("[data-t]").forEach((el) => el.onclick = () => {
    const t = el.dataset.t;
    if (!myTurn) return toast(hand ? "No es tu turno" : "La mano terminó");
    if (!can.has(t)) return toast(V.must ? "Tienes que salir con el doble " + V.must.split("-")[0] : "Esa ficha no calza en ninguna punta");
    const sd = O.fits(t, V.ends);
    // fits both ends with different numbers: ask which; otherwise it goes by itself
    if (sd.length > 1 && V.ends[0] !== V.ends[1]) { selTile = t; return renderTable(); }
    act("act", { move: "play", tile: t, side: sd[0] });
  });
  renderBar(myTurn, can, sides);
}
function resultHTML() {
  const R = V.result; if (!R) return "";
  const rows = V.players.map((p, i) => `<tr class="${R.team !== null && (V.teams ? i % 2 : i) === R.team ? "best" : ""}"><td>${esc(p.name)}${i === V.me ? " (tú)" : ""}</td>
    <td class="tiles">${R.hands[i].map((t) => { const [a, b] = O.halves(t); return tileHTML(a, b, "h xs"); }).join("") || "—"}</td><td><b>${p.score}</b></td></tr>`).join("");
  return `<section class="panel"><h2>${R.blocked ? "Tranque" : "¡Dominó!"}${R.team !== null ? ` · +${R.gain}` : ""}</h2>
    <table class="score"><tr><th>Jugador</th><th>Le quedó</th><th>Total</th></tr>${rows}</table>
    <p class="muted" style="margin-top:8px">${R.blocked ? "Nadie podía jugar: gana quien suma menos en su mano." : "Quien se queda sin fichas gana los puntos que les quedan a los rivales."} Se juega a ${O.TARGET}.</p></section>`;
}
function renderBar(myTurn, can, sides) {
  const bar = $("#bar");
  if (V.phase === "finished") { bar.innerHTML = V.players[V.me].host ? `<button class="btn gold" id="nx">Nueva partida</button>` : ""; const n = $("#nx"); if (n) n.onclick = () => act("act", { move: "next" }); return; }
  if (V.stage === "result") { bar.innerHTML = `<button class="btn gold" id="nx">Siguiente mano</button>`; $("#nx").onclick = () => act("act", { move: "next" }); return; }
  if (!myTurn) { bar.innerHTML = ""; return; }
  if (selTile && sides.length > 1) {
    bar.innerHTML = `<button class="btn gold" id="sL">◀ Izquierda (${V.ends[0]})</button><button class="btn gold" id="sR">Derecha (${V.ends[1]}) ▶</button>`;
    $("#sL").onclick = () => act("act", { move: "play", tile: selTile, side: "L" });
    $("#sR").onclick = () => act("act", { move: "play", tile: selTile, side: "R" });
    return;
  }
  if (can.size) { bar.innerHTML = ""; return; }
  bar.innerHTML = V.boneyard ? `<button class="btn gold" id="b-draw">Robar del pozo (${V.boneyard})</button>` : `<button class="btn gold" id="b-pass">Pasar</button>`;
  const d = $("#b-draw"); if (d) d.onclick = () => act("act", { move: "draw" });
  const p = $("#b-pass"); if (p) p.onclick = () => act("act", { move: "pass" });
}
async function act(action, extra) {
  if (busy) return false;
  busy = true;
  const v = await call(action, extra);
  busy = false;
  if (!v) return false;
  selTile = null;
  show(v);
  return true;
}

/* ---------- invitations ---------- */
const playLink = () => location.origin + location.pathname + "#m=" + code;
const inviteText = () => "¿Jugamos dominó? Entra aquí: " + playLink();
const waLink = () => "https://wa.me/?text=" + encodeURIComponent(inviteText());
async function copyLink() {
  try { await navigator.clipboard.writeText(inviteText()); return toast("Link copiado; pégalo en WhatsApp"); } catch (e) {}
  try { const ta = document.createElement("textarea"); ta.value = inviteText(); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Link copiado"); }
  catch (e) { toast("No se pudo copiar; usa WhatsApp"); }
}

/* ---------- boot ---------- */
const c0 = codeFromHash();
if (c0) openTable(c0); else renderStart();
window.addEventListener("hashchange", () => { const c = codeFromHash(); if (c !== code) location.reload(); });
</script>
