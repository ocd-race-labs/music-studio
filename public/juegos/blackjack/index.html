import * as O from "./engine.js";
/* ---------- against the machine ---------- */
function applyLocal(s, pi, action, b, rand) {
  if (action === "start") return O.start(s, pi, rand);
  if (action === "act") return O.act(s, pi, { action: b.move, amount: b.amount }, rand);
  const e = new Error("Acción desconocida"); e.user = true; throw e;
}
// the machines at the table bet a little and play the basic strategy against the dealer's up card
function botLocal(s, pi) {
  if (s.phase !== "playing") return null;
  const p = s.players[pi];
  if (s.stage === "betting") return p.inRound ? null : { action: "act", move: "bet", amount: Math.min(p.chips, O.MIN_BET * (1 + Math.floor(Math.random() * 3))) };
  if (s.stage !== "turns" || s.turn !== pi) return null;
  const t = O.total(p.hand), up = s.dealer[0] ? O.total([s.dealer[0]]) : 10, soft = O.soft(p.hand);
  const up_ = up === 1 ? 11 : up;
  if (p.hand.length === 2 && p.chips >= p.bet && (t === 11 || (t === 10 && up_ < 10) || (t === 9 && up_ >= 3 && up_ <= 6))) return { action: "act", move: "double" };
  let hit;
  if (soft) hit = t <= 17 || (t === 18 && up_ >= 9);
  else hit = t <= 11 || (t === 12 && (up_ <= 3 || up_ >= 7)) || (t >= 13 && t <= 16 && up_ >= 7);
  return { action: "act", move: hit ? "hit" : "stand" };
}

}

function cardHTML(id, cls = "", attrs = "") {
  const [r, x] = String(id).split("-");
  return `<div class="card ${x === "H" || x === "D" ? "red" : ""} ${cls}" ${attrs}><span class="r">${r}</span><span class="s1">${SUIT[x]}</span><span class="s2">${SUIT[x]}</span></div>`;
}
const backHTML = (cls = "") => `<div class="card back ${cls}"></div>`;

/* ---------- start / lobby ---------- */
function renderStart() {
  pill("Cartas");
  $("#bar").innerHTML = "";
  $("#app").innerHTML = `<section class="panel stack">
      <h2>Blackjack</h2>
      <p class="muted">De 1 a 6 jugadores contra la banca, cada uno en su teléfono. Todos parten con 100 fichas.</p>

      <div id="mine"></div>
      <div id="open"></div>
      ${Maquina.html({ noLevels: true, note: "Tú y 2 máquinas contra la banca, en este teléfono." })}

      <div><label class="lbl" for="cod">¿Tienes el código de una mesa?</label>
        <div class="code"><input type="text" id="cod" maxlength="10" placeholder="Ej: 3WFVTE" autocapitalize="characters" autocomplete="off"><button class="btn" id="go-cod">Entrar</button></div></div>
    </section>
    <section class="panel help"><b>Cómo se juega</b><ul>
      <li>Apuestas fichas y la banca reparte. Gana quien se acerca más a 21 sin pasarse.</li>
      <li>El As vale 1 u 11; J, Q y K valen 10.</li>
      <li>Pides cartas o te plantas. Con tus dos primeras cartas puedes doblar: duplicas la apuesta y recibes una sola carta más.</li>
      <li>La banca pide hasta tener 17. Ganar paga 1 a 1; blackjack (As + 10) paga 3 a 2.</li></ul></section>`;
  $("#create").onclick = async () => {
    if (!takeName()) return;
    const v = await call("create", { game: GAME }); if (!v) return;
    remember(v.code);
    code = v.code; location.hash = "m=" + code + keepHost(); show(v); watch();
  };
  const goCode = () => {
    const c = ($("#cod").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-Z0-9]{4,10}$/.test(c)) return toast("Escribe el código de la mesa (6 letras o números)");
    if (!takeName()) return;
    location.hash = "m=" + c + keepHost();
  };
  $("#go-cod").onclick = goCode; $("#cod").onkeydown = (e) => { if (e.key === "Enter") goCode(); };
  Maquina.bind($("#app"), (lv) => { if (takeName()) startMachine(lv); });
  listMine();
  listOpen();
}
const hide = (id) => store("juegos-ocultas", [id].concat(load("juegos-ocultas") || []).slice(0, 40));
async function delTable(id) {
  if (!client()) return false;
  const { data, error } = await sb.rpc("naipe_delete", { p_id: id, p_player: me.pid, p_key: me.pkey });
  return !error && data === true;
}
/* the tables you are already in come first, so leaving and coming back is one tap */
async function listMine() {
  const box = $("#mine");
  if (!box || !client()) return;
  const since = new Date(Date.now() - 12 * 3600 * 1000).toISOString();
  const { data } = await sb.from("naipe_pulse").select("id,host_name,phase,players,updated_at").eq("game", GAME).contains("player_ids", [me.pid]).in("phase", ["lobby", "playing"]).gt("updated_at", since).order("updated_at", { ascending: false }).limit(5);
  if (!$("#mine")) return;
  const hidden = load("juegos-ocultas") || [];
  const rows = (data || []).filter((r) => !hidden.includes(r.id));
  mineOpen = new Set(rows.map((r) => r.id));
  box.innerHTML = rows.length ? `<label class="lbl">Tus partidas</label><div class="tables">${rows.map((r) => `
      <div class="mrow"><button class="btn back2" data-back="${esc(r.id)}"><span>${r.phase === "lobby" ? "Volver a tu mesa" : "Volver a la partida"}${r.host_name && r.host_name !== me.name ? " de " + esc(r.host_name) : ""} · ${esc(r.id)}</span>
      <small>${r.phase === "lobby" ? "esperando" : "en juego"} · ${r.players} jug.</small></button><button class="del" data-del="${esc(r.id)}" data-ph="${r.phase}" aria-label="Cerrar o quitar esta mesa">✕</button></div>`).join("")}</div>` : "";
  box.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.del;
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro?"; b.classList.add("sure"); return; }
    if (await delTable(id)) toast("Mesa cerrada");
    else { hide(id); toast("La quitamos de tu lista"); }
    listMine();
  });
  box.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { location.hash = "m=" + b.dataset.back + keepHost(); });
  listOpen();
}
let mineOpen = new Set();
const client = () => (sb || (window.supabase && (sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } }))));
/* tables waiting for players: join one, or create a new one */
const mine0 = () => load("blackjack-mias") || [];
function remember(c) { store("blackjack-mias", [c].concat(mine0().filter((x) => x !== c)).slice(0, 10)); }
let openT = null;
async function listOpen() {
  clearTimeout(openT);
  const box = $("#open"); if (!box) return;
  if (!sb && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  if (!sb) return;
  const since = new Date(Date.now() - 30 * 60 * 1000).toISOString();
  const { data } = await sb.from("naipe_pulse").select("id,host_name,players,updated_at").eq("game", GAME).in("phase", GAME === "blackjack" ? ["lobby", "playing"] : ["lobby"]).gt("updated_at", since).order("updated_at", { ascending: false }).limit(15);
  if (!$("#open")) return;
  const hid = load("juegos-ocultas") || [];
  const rows = (data || []).filter((r) => r.players < O.MAX_PLAYERS && !mineOpen.has(r.id) && !hid.includes(r.id));
  const mine = mine0();
  box.innerHTML = rows.length ? `<label class="lbl">Mesas esperando jugadores</label><div class="tables">${rows.map((r) => `
      <button class="btn tbl" data-join="${esc(r.id)}"><span>${mine.includes(r.id) ? "Volver a tu mesa" : "Unirse a la mesa de " + esc(r.host_name || "alguien")}</span>
      <small>${r.players} ${r.players === 1 ? "persona" : "personas"}</small></button>`).join("")}</div>
      <div class="or">o</div>` : "";
  box.querySelectorAll("[data-join]").forEach((b) => b.onclick = async () => {
    if (!takeName()) return;
    code = b.dataset.join;
    const v = await call("join"); if (!v) { code = null; return listOpen(); }
    location.hash = "m=" + code + keepHost(); show(v); watch();
  });
  openT = setTimeout(listOpen, 4000);
}
function takeName() {
  const v = ($("#nm").value || "").trim().slice(0, 24);
  if (!v) { $("#nm").focus(); toast("Escribe tu nombre"); return false; }
  me.name = v; store("juegos-yo", me); return true;
}
async function openTable(c) {
  code = c;
  const v = await call("view");
  if (!v) { $("#app").innerHTML = `<section class="panel stack"><h2>No encontré esa mesa</h2><a class="btn primary" href="./">Crear una nueva</a></section>`; return; }
  if (v.outsider) return renderJoin(v);
  show(v); watch();
}
function renderJoin(v) {
  pill("Te invitaron");
  $("#bar").innerHTML = "";
  if (v.phase !== "lobby" && GAME !== "blackjack") { $("#app").innerHTML = `<section class="panel stack"><h2>Esta mesa ya empezó</h2><p class="muted">Pide que te inviten a la próxima.</p><a class="btn primary" href="./">Crear una mesa</a></section>`; return; }
  $("#app").innerHTML = `<section class="panel stack"><h2>Te invitaron a jugar blackjack</h2>
    <p class="muted">En la mesa: ${v.players.map(esc).join(", ")}</p>
    <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Rodrigo" value="${esc(me.name)}"></div>
    <button class="btn primary" id="go">Sentarme a la mesa</button></section>`;
  $("#go").onclick = async () => { if (!takeName()) return; const j = await call("join"); if (j) { show(j); watch(); } };
}

/* ---------- live updates: a tiny public version number says when to ask for a fresh view ---------- */
let watching = false;
function watch() {
  if (watching) return; watching = true;
  if (window.supabase) {
    if (!sb) sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
    sb.channel("blackjack-" + code).on("postgres_changes", { event: "*", schema: "public", table: "naipe_pulse", filter: "id=eq." + code }, () => poll()).subscribe();
  }
  setInterval(() => { if (!document.hidden) poll(); }, 1500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}
async function poll() {
  if (busy || !sb) return;
  const { data } = await sb.from("naipe_pulse").select("version").eq("id", code).maybeSingle();
  if (data && data.version !== lastVersion) { const v = await call("view"); if (v && !v.outsider) show(v); }
}

/* ---------- render ---------- */
function show(v) {
  if (code && !local && (!V || V.code !== v.code)) remember(code);
  const was = V;
  V = v; lastVersion = v.version;
  if (V.phase === "lobby") return renderLobby();
  renderTable(was);
}
function renderLobby() {
  const isHost = V.players[V.me].host;
  pill(local ? "🤖 " + Maquina.label(cpuLv) : "Mesa " + code);
  $("#app").innerHTML = `<section class="panel stack"><h2>Mesa ${code}</h2>
      <div class="plist">${V.players.map((p, i) => `<div><span>${esc(p.name)}${i === V.me ? " (tú)" : ""}</span><span class="muted">${p.host ? "creó la mesa" : ""}</span></div>`).join("")}</div>
      <p class="muted">${false ? "" : isHost ? "Cuando estén todos, empieza." : "Esperando que " + esc(V.players.find((p) => p.host).name) + " empiece."}</p>
      <div class="two"><button class="btn primary" id="copy">🔗 Copiar link</button><a class="btn wa" target="_blank" rel="noopener" href="${waLink()}">WhatsApp</a></div>
      ${isHost ? `<button class="btn" id="del" style="background:none;color:#a3262f;min-height:36px">Borrar esta mesa</button>` : ""}
    </section>`;
  const dl = $("#del");
  if (dl) dl.onclick = async () => {
    if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "¿Seguro? Toca otra vez para borrarla"; return; }
    if (await delTable(code)) { location.href = "./" + (keepHost() ? "#" + keepHost().slice(1) : ""); } else toast("No se pudo borrar");
  };
  $("#copy").onclick = copyLink;
  $("#bar").innerHTML = isHost ? `<button class="btn gold" id="start" >Empezar partida (${V.players.length})</button>` : "";
  const s = $("#start"); if (s) s.onclick = () => act("start");
}
let stake = [], lastRound = null, seenVersion = -1;
const OUT = { win: ["Ganas", "w", "Gana"], blackjack: ["¡Blackjack!", "w", "¡Blackjack!"], push: ["Empate", "p", "Empate"], lose: ["Pierdes", "l", "Pierde"], bust: ["Te pasaste", "l", "Se pasó"] };
const DEN = [50, 25, 10, 5];
// a balance as chips, like a rack: a few of each small value first, the rest in the biggest that fit
function split(n, rack) {
  const out = [];
  if (rack) for (const [d, k] of [[5, 4], [10, 3], [25, 2]]) for (let i = 0; i < k && n >= d; i++) { out.push(d); n -= d; }
  for (const d of DEN) { const k = Math.floor(n / d); for (let i = 0; i < k; i++) out.push(d); n -= k * d; }
  return { chips: out, rest: n };
}
function stackHTML(chips, cls = "", all = false, max = 14) {
  // chips of one value pile up; each pile shows at most `max`, the rest as a number; the rack shows every value
  const by = {}; chips.forEach((c) => (by[c] = (by[c] || 0) + 1));
  const keys = all ? DEN.slice().reverse() : Object.keys(by).map(Number).sort((a, b) => b - a);
  return keys.map((d) => {
    const n = by[d] || 0, shown = Math.min(n, max);
    if (!n) return `<span class="pile ${cls} empty" data-d="${d}"><i class="ck c${d} out" style="--k:0"></i></span>`;
    return `<span class="pile ${cls}" data-d="${d}" style="height:${(cls.includes("bet") ? 11 : 14) + (shown - 1) * 4}px">${Array.from({ length: shown }, (_, k) => `<i class="ck c${d}" style="--k:${k}"></i>`).join("")}${n > max ? `<em>×${n}</em>` : ""}</span>`;
  }).join("");
}
function renderTable(was) {
  const me = V.players[V.me], playing = V.phase === "playing", betting = V.stage === "betting";
  const myTurn = playing && V.stage === "turns" && V.turn === V.me;
  if (window.Perfil) Perfil.turn(myTurn || (betting && !me.inRound));
  pill(local ? "🤖 " + Maquina.label(cpuLv) : "Mesa " + code);
  // keep the finished hand on the table, faded, until the next deal
  if (V.stage === "result") lastRound = { dealer: V.dealer, dealerTotal: V.dealerTotal, players: V.players.map((p) => ({ hand: p.hand, total: p.total, outcome: p.outcome, paid: p.paid, bet: p.bet })) };
  if (!betting) stake = [];
  const ghost = betting && lastRound;
  const fresh = was && was.version !== V.version && V.stage === "result" && was.stage !== "result";
  const dealerCards = ghost ? lastRound.dealer : V.dealer;
  const stakeSum = stake.reduce((a, b) => a + b, 0);
  const seatView = (p, i) => {
    const g = ghost ? lastRound.players[i] : null;
    const hand = g ? g.hand : p.hand, total = g ? g.total : p.total, oc = g ? g.outcome : p.outcome, paid = g ? g.paid : p.paid;
    return { hand, total, oc, paid };
  };
  const others = V.players.map((p, i) => ({ p, i })).filter((x) => x.i !== V.me);
  const mine = seatView(me, V.me);
  const o = mine.oc && OUT[mine.oc];
  // what sits in my betting circle
  let circle = "";
  if (betting && !me.inRound) circle = stackHTML(stake, "bet");
  else if (me.bet) {
    const won = V.stage === "result" && (mine.oc === "win" || mine.oc === "blackjack");
    const lost = V.stage === "result" && (mine.oc === "lose" || mine.oc === "bust");
    circle = stackHTML(split(me.bet).chips, "bet" + (lost && fresh ? " away" : lost ? " gone" : ""));
    if (won) circle += stackHTML(split(mine.paid).chips, "bet prize" + (fresh ? " come" : ""));
  }
  const bank = split(betting && !me.inRound ? me.chips - stakeSum : me.chips, true);
  let status = "";
  if (betting) status = me.inRound ? "Esperando que los demás apuesten" : stakeSum ? `Apuestas ${stakeSum}: toca «Apostar»` : "Toca tus fichas para apostar";
  else if (V.stage === "turns") status = myTurn ? `Tu turno: tienes ${me.total}` : `Turno de ${esc(V.players[V.turn].name)}`;
  else status = V.dealerTotal > 21 ? `La banca se pasó (${V.dealerTotal})` : `La banca tiene ${V.dealerTotal}`;
  $("#app").innerHTML = `
    <div class="tablebj">
      <div class="dealer ${ghost ? "ghost" : ""}">
        <div class="dl">Banca${(ghost ? lastRound.dealerTotal : V.dealerTotal) != null && dealerCards.length ? ` · <b>${ghost ? lastRound.dealerTotal : V.dealerTotal}</b>` : ""}</div>
        <div class="hd">${dealerCards.length ? dealerCards.map((c) => (c ? cardHTML(c, "md") : backHTML("md"))).join("") : `<span class="slot"></span><span class="slot"></span>`}</div>
        <div class="rule">La banca pide hasta 17 · Blackjack paga 3 a 2</div>
      </div>
      <div class="status">${status}</div>
      ${others.length ? `<div class="others">${others.map(({ p, i }) => { const s = seatView(p, i), oo = s.oc && OUT[s.oc]; return `
        <div class="seat ${V.turn === i ? "turn" : ""}"><div class="nm">${esc(p.name)} <small>🪙${p.chips}</small></div>
          <div class="hd ${ghost ? "ghost" : ""}">${s.hand.map((c) => cardHTML(c, "xs")).join("")}${s.hand.length ? `<span class="tt ${s.total > 21 ? "x" : ""}">${s.total}</span>` : `<span class="muted">${betting ? (p.inRound ? "apostó " + p.bet : "apostando…") : ""}</span>`}</div>
          ${oo && !ghost ? `<span class="oc ${oo[1]}">${oo[2]}</span>` : ""}</div>`; }).join("")}</div>` : ""}
      <div class="myseat ${myTurn ? "turn" : ""}">
        <div class="hd ${ghost ? "ghost" : ""}">${mine.hand.map((c) => cardHTML(c, "md")).join("")}${mine.hand.length ? `<span class="tt ${mine.total > 21 ? "x" : ""}">${mine.total}</span>` : ""}
          ${o && !ghost ? `<span class="oc ${o[1]}">${o[0]}${mine.paid > 0 ? " +" + mine.paid : mine.paid < 0 ? " " + mine.paid : ""}</span>` : ""}</div>
        <div class="circle ${betting && !me.inRound ? "open" : ""}" id="circle">${circle || `<span class="ph">${betting && !me.inRound ? "Apuesta aquí" : ""}</span>`}
          ${betting && !me.inRound && stakeSum ? `<span class="sum">${stakeSum}</span>` : !betting && me.bet && !(V.stage === "result" && (mine.oc === "lose" || mine.oc === "bust")) ? `<span class="sum">${me.bet}</span>` : ""}</div>
      </div>
      <div class="tray">
        <div class="stacks" id="tray">${stackHTML(bank.chips, "bank", true)}${bank.rest ? `<span class="rest">+${bank.rest}</span>` : ""}</div>
        <div class="bal">Tus fichas <b>${me.chips}</b></div>
      </div>
    </div>
    <div class="log">${(V.log || []).slice(0, 2).map(esc).join(" · ")}</div>`;
  document.querySelectorAll(".card.back").forEach((e) => (e.innerHTML = ""));
  if (betting && !me.inRound) {
    // tap a pile in the tray: one chip of that value goes to the circle; tap the circle to take the last one back
    $("#tray").querySelectorAll(".pile").forEach((p) => p.onclick = () => {
      const d = +p.dataset.d;
      if (stakeSum + d > me.chips) return toast("No te alcanza");
      stake.push(d); renderTable(); const top = $("#circle .pile:last-of-type .ck:last-child"); if (top) top.classList.add("drop");
    });
    $("#circle").onclick = () => { if (stake.length) { stake.pop(); renderTable(); } };
  }
  renderBar(myTurn, me, stakeSum);
}
function renderBar(myTurn, me, stakeSum) {
  const bar = $("#bar");
  if (V.stage === "result") { bar.innerHTML = `<button class="btn gold" id="nx">Siguiente mano</button>`; $("#nx").onclick = () => act("act", { move: "next" }); return; }
  if (V.stage === "betting") {
    const host = V.players[V.me].host, someone = V.players.some((p) => p.inRound);
    const btns = [];
    if (!me.inRound) btns.push(`<button class="btn" id="b-clear" ${stakeSum ? "" : "disabled"}>Quitar</button><button class="btn gold" id="b-bet" ${stakeSum >= O.MIN_BET ? "" : "disabled"}>Apostar ${stakeSum || ""}</button>`);
    if (host && someone && V.players.some((p) => !p.inRound)) btns.push(`<button class="btn" id="b-deal">Repartir ya</button>`);
    bar.innerHTML = btns.join("");
    const c = $("#b-clear"); if (c) c.onclick = () => { stake = []; renderTable(); };
    const b = $("#b-bet"); if (b) b.onclick = () => act("act", { move: "bet", amount: stakeSum });
    const d = $("#b-deal"); if (d) d.onclick = () => act("act", { move: "deal" });
    return;
  }
  if (!myTurn) { bar.innerHTML = ""; return; }
  bar.innerHTML = `<button class="btn" id="b-stand">Plantarse</button><button class="btn gold" id="b-hit">Pedir carta</button>
    ${me.hand.length === 2 && me.chips >= me.bet ? `<button class="btn" id="b-dbl">Doblar</button>` : ""}`;
  $("#b-hit").onclick = () => act("act", { move: "hit" });
  $("#b-stand").onclick = () => act("act", { move: "stand" });
  const db = $("#b-dbl"); if (db) db.onclick = () => act("act", { move: "double" });
}
async function act(action, extra) {
  if (busy) return false;
  busy = true;
  const v = await call(action, extra);
  busy = false;
  if (!v) return false;
  if (extra && extra.move === "next") stake = [];
  show(v);
  return true;
}

/* ---------- invitations ---------- */
const playLink = () => location.origin + location.pathname + "#m=" + code;
const inviteText = () => "¿Jugamos blackjack? Entra aquí: " + playLink();
const waLink = () => "https://wa.me/?text=" + encodeURIComponent(inviteText());
async function copyLink() {
  try { await navigator.clipboard.writeText(inviteText()); return toast("Link copiado; pégalo en WhatsApp"); } catch (e) {}
  try { const ta = document.createElement("textarea"); ta.value = inviteText(); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Link copiado"); }
  catch (e) { toast("No se pudo copiar; usa WhatsApp"); }
}

/* ---------- boot ---------- */
const c0 = codeFromHash();
if (c0) openTable(c0); else renderStart();
window.addEventListener("hashchange", () => { const c = codeFromHash(); if (c !== code) location.reload(); });
</script>
