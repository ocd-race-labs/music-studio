<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nerviosito · Juegos en casa</title>
<meta name="apple-mobile-web-app-title" content="Juegos">
<meta name="theme-color" content="#1f5a3e">
<link rel="apple-touch-icon" href="../icon-180.png">
<script src="../supabase.js"></script>
<style>
@font-face{font-family:Sora;font-weight:600;font-display:swap;src:url(../fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:700;font-display:swap;src:url(../fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:800;font-display:swap;src:url(../fonts/sora-latin-800-normal.woff2) format("woff2")}
:root{--felt:#1f5a3e;--felt2:#174a33;--ink:#1d1f23;--red:#d22f3a;--paper:#fbfbfa;--gold:#ffcf3f}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--felt2)}
body{min-height:100vh;font-family:Sora,system-ui,sans-serif;color:var(--ink);padding-bottom:130px;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 50% 20%,#2a7350,var(--felt) 45%,var(--felt2));background-attachment:fixed}
header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;max-width:640px;margin:0 auto;position:sticky;top:0;z-index:10;
  background:rgba(23,74,51,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:0 0 16px 16px}
.back,.gear{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.9);color:var(--ink);text-decoration:none;font-size:22px;font-weight:800;border:none;font-family:inherit}
.gear{font-size:17px}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff;background:var(--red);padding:5px 12px;border-radius:10px}
.sp{flex:1}
.pill{font-size:12px;font-weight:700;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 10px;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:8px 10px;display:grid;gap:12px}
.panel{background:var(--paper);border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.25);padding:16px}
.panel h2{font-size:18px;font-weight:800;margin-bottom:10px}
.muted{color:#6c6f75;font-size:14px}
.btn{border:none;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;font-size:15px;background:#eeefef;color:var(--ink);cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:#fff}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.wa{background:#25d366;color:#08331a}
.btn:disabled{opacity:.35}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid #d5d6d8;background:#fff;width:100%}
label.lbl{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#6c6f75;margin:4px 0 6px}
.tables{display:grid;gap:8px}
.btn.tbl{justify-content:space-between;background:#fff4d0;text-align:left}
.btn.tbl small{font-weight:700;color:#6c6f75;font-size:12px}
.btn.back2{justify-content:space-between;background:#d9f2e1;text-align:left}
.mrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.mrow .del.sure{width:auto;padding:0 10px;background:#fde2e1;color:#a3262f;font-size:13px}
.mrow .del{border:none;border-radius:14px;width:46px;background:#eeefef;font:inherit;font-weight:800;font-size:16px;color:#6c6f75}
.btn.back2 small{font-weight:700;color:#2d6a43;font-size:12px}
.code{display:grid;grid-template-columns:1fr auto;gap:8px}
.code input{text-transform:uppercase;letter-spacing:2px;font-weight:800}
.or{text-align:center;color:#6c6f75;font-weight:700;font-size:13px;margin:2px 0}
.plist{display:grid;gap:6px}
.plist div{background:#f1f1f0;border-radius:10px;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between}
.help{font-size:13px;color:#4a4d53;line-height:1.5}
.help li{margin-left:18px}

/* cards */
.card{--w:46px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.12);background:#fff;position:relative;flex:none;
  box-shadow:0 1px 0 #cfd1d4,0 2px 5px rgba(0,0,0,.25);color:#1d1f23;font-weight:800;user-select:none}
.card.red{color:var(--red)}
.card .r{position:absolute;top:4%;left:9%;font-size:calc(var(--w)*.36);line-height:1;letter-spacing:-1px}
.card .s1{position:absolute;top:31%;left:9%;font-size:calc(var(--w)*.26);line-height:1}
.card .s2{position:absolute;bottom:6%;right:9%;font-size:calc(var(--w)*.56);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,#2f6fb5 0 5px,#2a63a3 5px 10px);box-shadow:inset 0 0 0 3px #fff,0 2px 5px rgba(0,0,0,.3)}

/* table */
.opps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opp{background:rgba(255,255,255,.92);border-radius:14px;padding:7px 10px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;position:relative}
.opp.turn{box-shadow:0 0 0 3px var(--gold)}
.opp.me{background:#fff4d0}
.opp .n{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .cnt{display:flex;align-items:center;gap:3px;color:#4a4d53}
.opp .mini{width:12px;height:17px;border-radius:3px;background:repeating-linear-gradient(45deg,#2f6fb5 0 3px,#2a63a3 3px 6px)}
.opp .hand{position:absolute;top:-9px;right:-7px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:2px 6px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.center{display:grid;justify-items:center;gap:8px;padding:6px 0 0}
.said{color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.said small{display:block;font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.6px}
.said b{font-size:34px;font-weight:800;letter-spacing:-.5px}
.pilebox{position:relative;width:132px;height:182px;display:grid;place-items:center}
.pilebox .ghost{position:absolute;inset:6px;border-radius:12px;border:2px dashed rgba(255,255,255,.3)}
.pilebox .card{--w:118px;position:absolute}
.pilebox .card.under{transform:rotate(-6deg) translate(-6px,4px);opacity:.9}
.pilebox .card.top{animation:land .22s ease-out}
@keyframes land{from{transform:translateY(-60px) scale(1.08);opacity:0}to{transform:none;opacity:1}}
.pilebox .cnt{position:absolute;bottom:-22px;color:#fff;font-size:12px;font-weight:700;opacity:.85}
.next{color:#fff;font-size:13px;font-weight:700;opacity:.85;margin-top:16px}
.next b{color:var(--gold)}
.status{color:#fff;text-align:center;font-weight:800;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.4);min-height:22px}
.mydeck{display:flex;align-items:center;justify-content:center;gap:14px;background:rgba(255,255,255,.1);border-radius:18px;padding:12px;border:none;font-family:inherit;color:#fff;width:100%}
.mydeck .stackc{position:relative;width:76px;height:104px}
.mydeck .stackc .card{--w:70px;position:absolute;left:0;top:0}
.mydeck .stackc .card:nth-child(2){left:3px;top:-3px}
.mydeck .stackc .card:nth-child(3){left:6px;top:-6px}
.mydeck .txt{text-align:left;font-size:14px;font-weight:700}
.mydeck .txt b{display:block;font-size:22px}
.mydeck.on{box-shadow:0 0 0 3px var(--gold);background:rgba(255,207,63,.18);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(255,207,63,.55)}}
.log{color:rgba(255,255,255,.75);font-size:12px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.45) 30%);display:flex;gap:8px;justify-content:center}
.bar:empty{display:none}
.bar .btn{flex:1;max-width:340px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.slap{min-height:78px!important;font-size:26px!important;background:#fff!important;color:var(--red)!important;border-radius:22px!important;touch-action:manipulation}
.slap.hot{background:var(--red)!important;color:#fff!important;animation:hot .5s ease-in-out infinite alternate}
.slap.done{background:#3c9a3a!important;color:#fff!important;animation:none}
@keyframes hot{to{transform:scale(1.04)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle,rgba(210,47,58,.0),rgba(210,47,58,.55));opacity:0;transition:opacity .15s}
.flash.on{opacity:1}
.timer{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;width:180px}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:left}
.banner{background:rgba(0,0,0,.35);color:#fff;border-radius:14px;padding:10px 12px;text-align:center;font-weight:700;font-size:14px}
.banner.bad{background:rgba(210,47,58,.85)}
.win{text-align:center}
.win .big{font-size:44px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
header .pill{min-width:0;overflow:hidden;text-overflow:ellipsis}
header .gear{width:36px;flex:none}
</style>
<script src="../perfil.js"></script>
<script src="../ayuda.js"></script>
</head>
<body>
<header>
  <a class="back" id="back" href="../" aria-label="Volver al menú de juegos">‹</a>
  <span class="logo">NERVIOSITO</span><span class="sp"></span>
  <span class="pill" id="pill"></span>
  <button class="gear" aria-label="Cómo jugar" onclick="Ayuda.open('nerviosito')" style="font-size:19px">?</button>
  <button class="gear" id="gear" aria-label="Tu perfil">⚙</button>
</header>
<div class="flash" id="flash"></div>
<main id="app"></main>
<div id="bar" class="bar"></div>
<div id="toast"></div>
<script type="module">
import { SAY, RANKS, MAX_PLAYERS } from "./engine.js";
const SB_URL = "https://yfjaznujnvkqgdlbnviu.supabase.co";
const SB_KEY = "sb_publishable_HyGsQ2i78GnWfRDUsW3ByQ_SQ6dCy_S";
const FN = SB_URL + "/functions/v1/nerviosito";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const me = Object.assign({ name: "", pid: null, pkey: null }, load("juegos-yo") || {});
if (!me.pid) { me.pid = uid(); me.pkey = uid() + uid(); }
store("juegos-yo", me);
(() => { const m = location.hash.match(/anfitrion=[A-Za-z0-9_-]{8,64}/); if (m) $("#back").href = "../#" + m[0]; })();
$("#gear").onclick = () => window.Perfil && Perfil.open();
document.addEventListener("perfil-cambio", (e) => { if (e.detail.name) { me.name = e.detail.name; const n = $("#nm"); if (n) n.value = me.name; } });

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
const pill = (t) => ($("#pill").textContent = t);
let sb = null;
const client = () => (sb || (window.supabase && (sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } }))));

/* ---------- server ---------- */
async function call(action, extra = {}) {
  try {
    const t0 = Date.now();
    const r = await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY },
      body: JSON.stringify(Object.assign({ action, code, player: me.pid, key: me.pkey, name: me.name }, extra)) });
    const j = await r.json();
    if (j.error) { toast(j.error); return null; }
    if (j.serverNow) offset = j.serverNow - (t0 + Date.now()) / 2;
    return j;
  } catch (e) { toast("Sin conexión"); return null; }
}

/* ---------- state ---------- */
let code = null, V = null, offset = 0, myIdx = -1;
const codeFromHash = () => { const m = location.hash.match(/(?:^#|&)m=([A-Z0-9]{4,10})/); return m ? m[1] : null; };
const keepHost = () => { const m = location.hash.match(/anfitrion=[A-Za-z0-9_-]{8,64}/); return m ? "&" + m[0] : ""; };
const serverNow = () => Date.now() + offset;

const SUIT = { S: "♠", H: "♥", D: "♦", C: "♣" };
function cardHTML(id, cls = "") {
  if (!id) return "";
  const [r, s] = id.split("-");
  return `<div class="card ${s === "H" || s === "D" ? "red" : ""} ${cls}"><span class="r">${r}</span><span class="s1">${SUIT[s]}</span><span class="s2">${SUIT[s]}</span></div>`;
}
const back = (cls = "") => `<div class="card back ${cls}"></div>`;

/* ---------- start ---------- */
function renderStart() {
  pill("Cartas");
  $("#bar").innerHTML = "";
  $("#app").innerHTML = `<section class="panel stack">
      <h2>Nerviosito</h2>
      <p class="muted">De 2 a 8 jugadores, cada uno en su teléfono. Un mazo inglés de 52 cartas.</p>
      <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Magda" value="${esc(me.name)}"></div>
      <div id="mine"></div>
      <div id="open"></div>
      <button class="btn primary" id="create">Crear mesa nueva</button>
      <div><label class="lbl" for="cod">¿Tienes el código de una mesa?</label>
        <div class="code"><input type="text" id="cod" maxlength="10" placeholder="Ej: VY7AU4" autocapitalize="characters" autocomplete="off"><button class="btn" id="go-cod">Entrar</button></div></div>
    </section>
    <section class="panel help"><b>Cómo se juega</b><ul>
      <li>Se reparte todo el mazo boca abajo. Nadie ve sus cartas.</li>
      <li>Por turno, cada uno da vuelta su carta de arriba al centro mientras se cuenta: As, Dos, Tres … Jota, Reina, Rey, y vuelta a empezar.</li>
      <li>Si la carta coincide con lo que se dijo, ¡todos ponen la mano! El último en ponerla, o quien no la pone, se lleva todo el pozo.</li>
      <li>Poner la mano cuando no coincide también te hace llevarte el pozo.</li>
      <li>Gana el primero que se queda sin cartas.</li></ul></section>`;
  $("#create").onclick = async () => {
    if (!takeName()) return;
    const v = await call("create"); if (!v) return;
    code = v.code; location.hash = "m=" + code + keepHost(); show(v); watch();
  };
  const goCode = () => {
    const c = ($("#cod").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-Z0-9]{4,10}$/.test(c)) return toast("Escribe el código de la mesa (6 letras o números)");
    if (!takeName()) return;
    location.hash = "m=" + c + keepHost();
  };
  $("#go-cod").onclick = goCode; $("#cod").onkeydown = (e) => { if (e.key === "Enter") goCode(); };
  listMine();
  listOpen();
}
const hide = (id) => store("juegos-ocultas", [id].concat(load("juegos-ocultas") || []).slice(0, 40));
async function delTable(id) {
  if (!client()) return false;
  const { data, error } = await sb.rpc("nervio_delete", { p_id: id, p_player: me.pid, p_key: me.pkey });
  return !error && data === true;
}
/* the tables you are already in come first, so leaving and coming back is one tap */
let mineOpen = new Set();
async function listMine() {
  const box = $("#mine"); if (!box || !client()) return;
  const since = new Date(Date.now() - 12 * 3600 * 1000).toISOString();
  const { data } = await sb.from("nervio_public").select("id,host_name,phase,players,updated_at").in("phase", ["lobby", "playing"])
    .contains("view", { players: [{ id: me.pid }] }).gt("updated_at", since).order("updated_at", { ascending: false }).limit(5);
  if (!$("#mine")) return;
  const hidden = load("juegos-ocultas") || [];
  const rows = (data || []).filter((r) => !hidden.includes(r.id));
  mineOpen = new Set(rows.map((r) => r.id));
  box.innerHTML = rows.length ? `<label class="lbl">Tus partidas</label><div class="tables">${rows.map((r) => `
      <div class="mrow"><button class="btn back2" data-back="${esc(r.id)}"><span>${r.phase === "lobby" ? "Volver a tu mesa" : "Volver a la partida"} · ${esc(r.id)}</span>
      <small>${r.phase === "lobby" ? "esperando" : "en juego"} · ${r.players} jug.</small></button><button class="del" data-del="${esc(r.id)}" data-ph="${r.phase}" aria-label="Cerrar o quitar esta mesa">✕</button></div>`).join("")}</div>` : "";
  box.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.del;
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro?"; b.classList.add("sure"); return; }
    if (await delTable(id)) toast("Mesa cerrada");
    else { hide(id); toast("La quitamos de tu lista"); }
    listMine();
  });
  box.querySelectorAll("[data-back]").forEach((b) => b.onclick = () => { location.hash = "m=" + b.dataset.back + keepHost(); });
  listOpen();
}
let openT = null;
async function listOpen() {
  clearTimeout(openT);
  const box = $("#open"); if (!box || !client()) return;
  const since = new Date(Date.now() - 30 * 60 * 1000).toISOString();
  const { data } = await sb.from("nervio_public").select("id,host_name,players,updated_at").eq("phase", "lobby").gt("updated_at", since).order("updated_at", { ascending: false }).limit(15);
  if (!$("#open")) return;
  const hid = load("juegos-ocultas") || [];
  const rows = (data || []).filter((r) => r.players < MAX_PLAYERS && !mineOpen.has(r.id) && !hid.includes(r.id));
  box.innerHTML = rows.length ? `<label class="lbl">Mesas esperando jugadores</label><div class="tables">${rows.map((r) => `
      <button class="btn tbl" data-join="${esc(r.id)}"><span>Unirse a la mesa de ${esc(r.host_name || "alguien")}</span>
      <small>${r.players} ${r.players === 1 ? "persona" : "personas"}</small></button>`).join("")}</div><div class="or">o</div>` : "";
  box.querySelectorAll("[data-join]").forEach((b) => b.onclick = async () => {
    if (!takeName()) return;
    code = b.dataset.join;
    const v = await call("join"); if (!v) { code = null; return listOpen(); }
    location.hash = "m=" + code + keepHost(); show(v); watch();
  });
  openT = setTimeout(listOpen, 4000);
}
function takeName() {
  const v = ($("#nm").value || "").trim().slice(0, 24);
  if (!v) { $("#nm").focus(); toast("Escribe tu nombre"); return false; }
  me.name = v; store("juegos-yo", Object.assign(load("juegos-yo") || {}, me)); return true;
}
async function openTable(c) {
  code = c;
  if (!client()) return;
  const { data } = await sb.from("nervio_public").select("view").eq("id", c).maybeSingle();
  if (!data) { $("#app").innerHTML = `<section class="panel stack"><h2>No encontré esa mesa</h2><a class="btn primary" href="./">Crear una nueva</a></section>`; return; }
  const v = data.view;
  if (v.players.some((p) => p.id === me.pid)) { show(v); watch(); return; }
  renderJoin(v);
}
function renderJoin(v) {
  pill("Te invitaron");
  $("#bar").innerHTML = "";
  if (v.phase !== "lobby") { $("#app").innerHTML = `<section class="panel stack"><h2>Esta mesa ya empezó</h2><p class="muted">Pide que te inviten a la próxima.</p><a class="btn primary" href="./">Crear una mesa</a></section>`; return; }
  $("#app").innerHTML = `<section class="panel stack"><h2>Te invitaron a jugar nerviosito</h2>
    <p class="muted">En la mesa: ${v.players.map((p) => esc(p.name)).join(", ")}</p>
    <div><label class="lbl" for="nm">Tu nombre</label><input type="text" id="nm" maxlength="24" placeholder="Ej: Rodrigo" value="${esc(me.name)}"></div>
    <button class="btn primary" id="go">Sentarme a la mesa</button></section>`;
  $("#go").onclick = async () => { if (!takeName()) return; const j = await call("join"); if (j) { show(j); watch(); } };
}

/* ---------- live updates: the public row carries the whole view ---------- */
let watching = false;
function watch() {
  if (watching || !client()) return; watching = true;
  sb.channel("nervio-" + code).on("postgres_changes", { event: "*", schema: "public", table: "nervio_public", filter: "id=eq." + code },
    (p) => { if (p.new && p.new.view) show(p.new.view); }).subscribe();
  setInterval(() => { if (!document.hidden) poll(); }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}
async function poll() {
  const { data } = await sb.from("nervio_public").select("view").eq("id", code).maybeSingle();
  if (data && data.view) show(data.view);
}

/* ---------- render ---------- */
let seenFlip = null, ticking = null, raf = 0, sending = false;
function show(v) {
  if (V && v.version < V.version) return; // an older view arriving late
  const fresh = !V || v.version !== V.version || v.phase !== V.phase;
  V = v; myIdx = V.players.findIndex((p) => p.id === me.pid);
  if (!fresh && V.phase !== "playing") return;
  if (V.phase === "lobby") return renderLobby();
  renderTable();
}
function renderLobby() {
  const isHost = V.hostId === me.pid;
  pill("Mesa " + code);
  Perfil.turn(false);
  $("#app").innerHTML = `<section class="panel stack"><h2>Mesa ${code}</h2>
      <div class="plist">${V.players.map((p, i) => `<div><span>${esc(p.name)}${i === myIdx ? " (tú)" : ""}</span><span class="muted">${p.id === V.hostId ? "creó la mesa" : ""}</span></div>`).join("")}</div>
      <p class="muted">${V.players.length < 2 ? "Invita al menos a una persona." : isHost ? "Cuando estén todos, empieza." : "Esperando que " + esc(V.players.find((p) => p.id === V.hostId).name) + " empiece."}</p>
      <div class="two"><button class="btn primary" id="copy">🔗 Copiar link</button><a class="btn wa" target="_blank" rel="noopener" href="${waLink()}">WhatsApp</a></div>
      ${isHost ? `<button class="btn" id="del" style="background:none;color:#a3262f;min-height:36px">Borrar esta mesa</button>` : ""}
    </section>`;
  const dl = $("#del");
  if (dl) dl.onclick = async () => {
    if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "¿Seguro? Toca otra vez para borrarla"; return; }
    if (await delTable(code)) { location.href = "./" + (keepHost() ? "#" + keepHost().slice(1) : ""); } else toast("No se pudo borrar");
  };
  $("#copy").onclick = copyLink;
  $("#bar").innerHTML = isHost ? `<button class="btn gold" id="start" ${V.players.length < 2 ? "disabled" : ""}>Empezar partida (${V.players.length})</button>` : "";
  const s = $("#start"); if (s) s.onclick = () => act("start");
}
function renderTable() {
  pill("Mesa " + code);
  const P = V.players, mine = P[myIdx] || { count: 0 }, w = V.window;
  const playing = V.phase === "playing";
  const myTurn = playing && !w && V.turn === myIdx;
  Perfil.turn(myTurn);
  const iSlapped = w && w.slaps.includes(myIdx);

  // what just happened
  let banner = "";
  const t = V.lastTake;
  if (t && !w && serverNow() - t.at < 4000) {
    const who = t.who === myIdx ? "Te llevaste" : esc(P[t.who].name) + " se llevó";
    banner = `<div class="banner ${t.who === myIdx ? "bad" : ""}">${who} ${t.n} ${t.n === 1 ? "carta" : "cartas"} · ${esc(t.why)}</div>`;
  }
  const f = V.lastFlip;
  const flipKey = f ? f.at + ":" + f.by : null;
  const newFlip = flipKey !== seenFlip; seenFlip = flipKey;

  const chips = P.map((p, i) => {
    const k = w ? w.slaps.indexOf(i) : -1;
    return `<div class="opp ${V.turn === i && playing && !w ? "turn" : ""} ${i === myIdx ? "me" : ""}"><span class="n">${esc(p.name)}${i === myIdx ? " (tú)" : ""}</span>
      <span class="cnt"><span class="mini"></span>${p.count}</span>${k >= 0 ? `<span class="hand">✋${k + 1}</span>` : ""}</div>`;
  }).join("");

  let status = "";
  if (V.phase === "finished") status = "";
  else if (w) status = iSlapped ? "¡Bien! Esperando al resto…" : `¡${SAY[w.said]}! ¡Pon la mano!`;
  else if (myTurn) status = "Tu turno: da vuelta tu carta";
  else status = "Turno de " + esc(P[V.turn].name);

  const saidNow = f && V.centerCount ? SAY[f.said] : null;
  const winHTML = V.phase === "finished" ? `<section class="panel win"><div class="big">🏆</div><h2>${V.winner === myIdx ? "¡Ganaste!" : "Ganó " + esc(P[V.winner].name)}</h2>
      <p class="muted">${V.winner === myIdx ? "Te quedaste sin cartas." : esc(P[V.winner].name) + " se quedó sin cartas."}</p></section>` : "";

  $("#app").innerHTML = `
    <div class="opps">${chips}</div>
    ${winHTML}
    <div class="center">
      <div class="said"><small>${saidNow ? (f.by === myIdx ? "Dijiste" : esc(P[f.by].name) + " dijo") : "Se parte con"}</small><b>${saidNow ? "«" + SAY[f.said] + "»" : "«As»"}</b></div>
      <div class="pilebox">${V.centerCount ? (V.centerCount > 1 ? back("under") : "") + cardHTML(V.top, newFlip ? "top" : "") : `<div class="ghost"></div>`}
        <span class="cnt">${V.centerCount ? V.centerCount + (V.centerCount === 1 ? " carta" : " cartas") + " en el pozo" : "Pozo vacío"}</span></div>
      ${w ? `<div class="timer"><i id="tbar"></i></div>` : playing ? `<div class="next">Ahora se dice: <b>${SAY[V.count]}</b></div>` : ""}
    </div>
    <div class="status">${status}</div>
    ${banner}
    ${playing ? `<button class="mydeck ${myTurn ? "on" : ""}" id="deck" ${mine.count ? "" : "disabled"}>
      <div class="stackc">${mine.count ? back() + (mine.count > 1 ? back() : "") + (mine.count > 2 ? back() : "") : ""}</div>
      <div class="txt"><b>${mine.count}</b>${mine.count === 1 ? "carta tuya" : "cartas tuyas"}${myTurn ? "<br>Toca para dar vuelta" : ""}</div></button>` : ""}
    <div class="log">${(V.log || []).slice(0, 2).map(esc).join(" · ")}</div>`;

  const deck = $("#deck");
  if (deck) deck.onclick = () => { if (myTurn) act("flip"); else if (w) toast("¡Pon la mano!"); else toast("Es el turno de " + P[V.turn].name); };

  // the bar: the slap button during play, the rematch at the end
  const bar = $("#bar");
  if (playing) {
    bar.innerHTML = `<button class="btn slap ${w ? (iSlapped ? "done" : "hot") : ""}" id="slap">${iSlapped ? "✋ ¡Listo!" : "✋ ¡Mano!"}</button>`;
    $("#slap").addEventListener("pointerdown", slap);
  } else if (V.phase === "finished") {
    const isHost = V.hostId === me.pid;
    bar.innerHTML = isHost ? `<button class="btn gold" id="again">Jugar otra vez</button>` : "";
    if (isHost) $("#again").onclick = () => act("start");
    if (!isHost) $("#app").insertAdjacentHTML("beforeend", `<p class="status" style="font-size:13px">Esperando que ${esc(P.find((p) => p.id === V.hostId).name)} empiece otra.</p>`);
  } else bar.innerHTML = "";

  $("#flash").classList.toggle("on", !!w && !iSlapped);
  runTimer();
}
function runTimer() {
  cancelAnimationFrame(raf);
  clearTimeout(ticking);
  const w = V && V.window; if (!w) return;
  const total = w.deadline - (V.lastFlip ? V.lastFlip.at : w.deadline - 3500);
  const step = () => {
    const left = w.deadline - serverNow();
    const bar = $("#tbar"); if (bar) bar.style.transform = `scaleX(${Math.max(0, left / total)})`;
    if (left > 0) raf = requestAnimationFrame(step);
  };
  step();
  // when time runs out somebody has to close the round: every phone asks, the server does it once
  ticking = setTimeout(() => { if (V.window && V.window.deadline === w.deadline) call("tick").then((v) => v && show(v)); }, Math.max(0, w.deadline - serverNow()) + 250 + Math.random() * 300);
}
async function slap(e) {
  e.preventDefault();
  if (!V || V.phase !== "playing" || sending) return;
  const w = V.window;
  if (w && w.slaps.includes(myIdx)) return;
  if (w) { w.slaps.push(myIdx); renderTable(); }
  sending = true;
  const v = await call("slap");
  sending = false;
  if (v) show(v);
}
let busy = false;
async function act(action, extra) {
  if (busy) return;
  busy = true;
  const v = await call(action, extra);
  busy = false;
  if (v) show(v);
}

/* ---------- invitations ---------- */
const playLink = () => location.origin + location.pathname + "#m=" + code;
const inviteText = () => "¿Jugamos nerviosito? Entra aquí: " + playLink();
const waLink = () => "https://wa.me/?text=" + encodeURIComponent(inviteText());
async function copyLink() {
  try { await navigator.clipboard.writeText(inviteText()); return toast("Link copiado; pégalo en WhatsApp"); } catch (e) {}
  try { const ta = document.createElement("textarea"); ta.value = inviteText(); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Link copiado"); }
  catch (e) { toast("No se pudo copiar; usa WhatsApp"); }
}

/* ---------- boot ---------- */
const c0 = codeFromHash();
if (c0) openTable(c0); else renderStart();
window.addEventListener("hashchange", () => { const c = codeFromHash(); if (c !== code) location.reload(); });
</script>
</body>
